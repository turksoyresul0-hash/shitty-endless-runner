<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FPS Mobile Preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#111;color:#fff}body{background:linear-gradient(#6fa7c7 0 38%,#477347 38% 100%)}
.scene{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.2),transparent 30%,transparent 70%,rgba(0,0,0,.25))}.road{position:absolute;left:12%;right:12%;bottom:0;height:63%;background:linear-gradient(90deg,#414141,#6a6a6a 50%,#414141);clip-path:polygon(30% 0,70% 0,100% 100%,0 100%);opacity:.9}.enemy{position:absolute;width:48px;height:82px;background:#a62828;border-radius:9px 9px 4px 4px;left:67%;top:35%;box-shadow:0 0 18px #000}.enemy:before{content:'';position:absolute;width:28px;height:28px;background:#d6b29b;border-radius:50%;left:10px;top:-28px}.hud{position:absolute;left:18px;top:18px;text-shadow:2px 2px 5px #000;font-size:16px;line-height:1.55}.cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px}.gun{position:absolute;right:13%;bottom:0;width:170px;height:230px;transform:rotate(-5deg)}.gun .body{position:absolute;width:105px;height:55px;right:10px;bottom:75px;background:#20252a;border-radius:7px}.gun .barrel{position:absolute;width:18px;height:120px;right:75px;bottom:110px;background:#111;transform:rotate(90deg);border-radius:5px}.gun .grip{position:absolute;width:28px;height:85px;right:42px;bottom:10px;background:#111;transform:rotate(15deg);border-radius:4px}.joystick{position:absolute;left:28px;bottom:35px;width:120px;height:120px;border:2px solid rgba(255,255,255,.4);border-radius:50%;background:rgba(0,0,0,.18)}.joystick:after{content:'';position:absolute;width:55px;height:55px;left:31px;top:31px;border-radius:50%;background:rgba(255,255,255,.45)}.look{position:absolute;right:24px;bottom:30px;width:190px;height:170px;border:1px dashed rgba(255,255,255,.25);border-radius:20px}.btn{position:absolute;border:0;color:#fff;font-weight:bold;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.35);box-shadow:0 5px 18px #0006}.fire{right:38px;bottom:205px;width:78px;height:78px;border-radius:50%;background:rgba(180,30,30,.8)}.jump{right:125px;bottom:95px;width:58px;height:58px;border-radius:50%}.reload{right:42px;bottom:105px;width:58px;height:58px;border-radius:50%}.slots{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:7px}.slots span{padding:8px 11px;border-radius:7px;background:#111b;border:1px solid #aaa}.preview{position:absolute;left:50%;top:18px;transform:translateX(-50%);padding:7px 14px;border-radius:20px;background:#111c;border:1px solid #777;font-size:13px}@media(max-width:600px){.hud{font-size:13px}.gun{right:3%;transform:scale(.8) rotate(-5deg);transform-origin:bottom right}.look{width:160px}.preview{font-size:11px}}
</style></head><body>
<div class="scene"></div><div class="road"></div><div class="enemy"></div>
<div class="preview">MOBİL FPS — ÖN İZLEME</div>
<div class="hud">❤️ HP: 100<br>🔫 Pistol · 12 / 72<br>💰 850<br>🌊 Dalga: 3 · 👾 7</div>
<div class="cross">+</div><div class="gun"><div class="body"></div><div class="barrel"></div><div class="grip"></div></div>
<div class="joystick"></div><div class="look"></div><button class="btn fire">ATEŞ</button><button class="btn jump">JUMP</button><button class="btn reload">R</button>
<div class="slots"><span>1 Pistol</span><span>2 Shotgun</span><span>3 Sniper</span><span>👤 Karakter</span></div>
</body></html>
