<!doctype html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FPS Oyunu</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial}#hud{position:fixed;z-index:5;top:15px;left:15px;color:#fff;font-size:18px;text-shadow:2px 2px 4px #000}#cross{position:fixed;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);color:white;font-size:28px}#msg{position:fixed;z-index:6;top:15%;left:50%;transform:translateX(-50%);color:white;font-size:24px;font-weight:bold}.modal{display:none;position:fixed;z-index:10;inset:0;align-items:center;justify-content:center;background:#000b;color:#fff}.panel{background:#15181e;padding:25px;border-radius:16px;text-align:center;min-width:300px}.panel button{padding:10px 20px;margin:6px;border:0;border-radius:8px;cursor:pointer}.shopgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:#252a32;padding:12px;border-radius:10px}.card button{width:100%}@media(max-width:650px){.shopgrid{grid-template-columns:1fr}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script></head><body><div id="cross">+</div><div id="hud">❤️ HP: <span id="hp">100</span><br>🔫 <span id="weapon">Pistol</span> | <span id="ammo">12</span>/<span id="reserve">72</span><br>💰 <span id="money">0</span><br>🌊 Dalga: <span id="wave">1</span> | 👾 <span id="count">0</span><br><small>WASD • SPACE • Fare • R • 1/2/3 • B</small></div><div id="msg"></div><div id="shop" class="modal"><div class="panel"><h2>🔫 SİLAH MAĞAZASI</h2><div>Para: <b id="shopMoney">0</b></div><div id="shopGrid" class="shopgrid"></div><button id="closeShop">Kapat</button></div></div><div id="over" class="modal"><div class="panel"><h1>OYUN BİTTİ</h1><p>Dalga: <b id="fw">1</b> • Öldürme: <b id="fk">0</b></p><button id="restart">TEKRAR OYNA</button></div></div><script type="module">import*as THREE from'three';const scene=new THREE.Scene();scene.background=new THREE.Color(0x87ceeb);scene.fog=new THREE.Fog(0x87ceeb,20,150);const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1000);camera.rotation.order='YXZ';const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x557755,1.2));const sun=new THREE.DirectionalLight(0xffffff,1.5);sun.position.set(30,50,20);scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshStandardMaterial({color:0x3c7a3c}));ground.rotation.x=-Math.PI/2;scene.add(ground);function box(x,y,z,w,h,d,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c}));m.position.set(x,y,z);scene.add(m)}box(0,5,-70,140,10,2,0x555);box(0,5,70,140,10,2,0x555);box(-70,5,0,2,10,140,0x555);box(70,5,0,2,10,140,0x555);const player={p:new THREE.Vector3(0,2,5),ry:0,rx:0,vy:0,jump:true,hp:100,money:0,speed:8},keys={},enemies=[];let mouse=false,shop=false,dead=false,wave=1,kills=0,last=0,reloading=false,next=null,current='pistol';const weapons={pistol:{name:'Pistol',price:0,damage:50,delay:260,mag:12,reserve:72,reload:650,recoil:.018,pellets:1,spread:.002,color:0x222222},shotgun:{name:'Shotgun',price:700,damage:28,delay:650,mag:6,reserve:36,reload:900,recoil:.045,pellets:7,spread:.045,color:0x5b321e},sniper:{name:'Sniper',price:1200,damage:140,delay:900,mag:5,reserve:20,reload:1100,recoil:.055,pellets:1,spread:.001,color:0x263238}};let owned=JSON.parse(localStorage.getItem('fpsOwnedWeapons')||'["pistol"]');let ammo=JSON.parse(localStorage.getItem('fpsAmmoState')||'null')||{};for(const k in weapons)if(!ammo[k])ammo[k]={ammo:weapons[k].mag,reserve:weapons[k].reserve};const gun=new THREE.Group();camera.add(gun);scene.add(camera);function save(){localStorage.setItem('fpsOwnedWeapons',JSON.stringify(owned));localStorage.setItem('fpsAmmoState',JSON.stringify(ammo))}function state(){return ammo[current]}function ui(){hp.textContent=Math.max(0,Math.round(player.hp));money.textContent=player.money;weapon.textContent=weapons[current].name;ammoEl.textContent=state().ammo;reserve.textContent=state().reserve;waveEl.textContent=wave;count.textContent=enemies.length;shopMoney.textContent=player.money}const hp=document.getElementById('hp'),money=document.getElementById('money'),weapon=document.getElementById('weapon'),ammoEl=document.getElementById('ammo'),waveEl=document.getElementById('wave'),count=document.getElementById('count');function msg(t){const e=document.getElementById('msg');e.textContent=t;e.style.opacity=1;clearTimeout(msg.t);msg.t=setTimeout(()=>e.style.opacity=0,700)}function buildGun(){while(gun.children.length)gun.remove(gun.children[0]);const w=weapons[current],body=new THREE.Mesh(new THREE.BoxGeometry(current==='sniper'?.28:.34,.22,current==='sniper'?1.05:.72),new THREE.MeshStandardMaterial({color:w.color,metalness:.65,roughness:.3}));body.position.set(.36,-.32,current==='sniper'?- .86:-.72);gun.add(body);const len=current==='sniper'?1.05:current==='shotgun'?.75:.55,b=new THREE.Mesh(new THREE.CylinderGeometry(.055,.055,len,12),new THREE.MeshStandardMaterial({color:0x111111,metalness:.8}));b.rotation.x=Math.PI/2;b.position.set(.36,-.28,-.72-len/2);gun.add(b)}function selectWeapon(k){if(!owned.includes(k)){msg('Önce mağazadan satın al!');return}current=k;reloading=false;buildGun();ui();renderShop();msg(weapons[k].name)}function reload(){const w=weapons[current],s=state();if(dead||reloading||s.ammo>=w.mag||s.reserve<=0)return;reloading=true;msg('YENİDEN YÜKLE...');setTimeout(()=>{const n=Math.min(w.mag-s.ammo,s.reserve);s.ammo+=n;s.reserve-=n;reloading=false;ui();save()},w.reload)}function shoot(){const now=performance.now(),w=weapons[current],s=state();if(shop||dead||reloading||now-last<w.delay)return;if(s.ammo<=0)return reload();last=now;s.ammo--;player.rx=THREE.MathUtils.clamp(player.rx+w.recoil,-1.4,1.4);gun.position.z=.08;setTimeout(()=>gun.position.z=0,80);const ray=new THREE.Raycaster();for(let i=0;i<w.pellets;i++){ray.setFromCamera(new THREE.Vector2((Math.random()-.5)*w.spread,(Math.random()-.5)*w.spread),camera);const h=ray.intersectObjects(enemies,true).find(x=>x.object.userData.enemy);if(h)damageEnemy(h.object,w.damage)}save();ui()}function spawnEnemy(x,z){const g=new THREE.Group(),b=new THREE.Mesh(new THREE.BoxGeometry(1.5,2.5,1.5),new THREE.MeshStandardMaterial({color:0xaa2222}));b.userData.enemy=true;g.add(b);g.position.set(x,1.25,z);Object.assign(g.userData,{enemy:true,hp:100+(wave-1)*20,speed:2+Math.min((wave-1)*.12,2.2),damage:5+Math.floor((wave-1)/3),delay:850-Math.min((wave-1)*20,350),last:0});scene.add(g);enemies.push(g)}function spawnWave(){for(let i=0;i<Math.min(3+wave*2,28);i++){const a=Math.random()*Math.PI*2,d=28+Math.random()*30;spawnEnemy(Math.cos(a)*d,Math.sin(a)*d)}msg('DALGA '+wave+' BAŞLADI!');ui()}function damageEnemy(o,d){const e=o.parent?.userData.enemy?o.parent:o;if(!e?.userData.enemy)return;e.userData.hp-=d;if(e.userData.hp<=0){scene.remove(e);const i=enemies.indexOf(e);if(i>=0)enemies.splice(i,1);kills++;player.money+=100+wave*10;if(!enemies.length&&!next){player.money+=150+wave*50;msg('DALGA TEMİZ!');next=setTimeout(()=>{wave++;next=null;spawnWave()},2200)}}ui()}function hit(d){if(dead)return;player.hp-=d;if(player.hp<=0)die();ui()}function die(){dead=true;mouse=false;fw.textContent=wave;fk.textContent=kills;document.getElementById('over').style.display='flex'}function reset(){if(next)clearTimeout(next);for(const e of enemies)scene.remove(e);enemies.length=0;wave=1;kills=0;dead=false;player.p.set(0,2,5);player.ry=player.rx=player.vy=0;player.hp=100;player.money=0;current='pistol';reloading=false;for(const k in weapons)ammo[k]={ammo:weapons[k].mag,reserve:weapons[k].reserve};document.getElementById('over').style.display='none';buildGun();save();spawnWave();ui()}function renderShop(){const g=document.getElementById('shopGrid');g.innerHTML='';for(const[id,w]of Object.entries(weapons)){const d=document.createElement('div');d.className='card';const has=owned.includes(id);d.innerHTML='<h3>'+w.name+'</h3><div>Hasar: '+w.damage+'<br>Şarjör: '+w.mag+'<br>Fiyat: '+(w.price||'Ücretsiz')+'</div>';const b=document.createElement('button');b.textContent=has?(current===id?'Kullanılıyor':'Kuşan'):'Satın Al';b.disabled=!has&&player.money<w.price;b.onclick=()=>{if(has)selectWeapon(id);else{player.money-=w.price;owned.push(id);save();renderShop();ui()}};d.appendChild(b);g.appendChild(d)}}function toggleShop(){if(dead)return;shop=!shop;document.getElementById('shop').style.display=shop?'flex':'none';mouse=false;renderShop()}document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'&&player.jump&&!shop&&!dead){player.vy=9;player.jump=false}if(e.code==='KeyR')reload();if(e.code==='KeyB')toggleShop();if(e.code==='Digit1')selectWeapon('pistol');if(e.code==='Digit2')selectWeapon('shotgun');if(e.code==='Digit3')selectWeapon('sniper')});document.addEventListener('keyup',e=>keys[e.code]=false);document.addEventListener('mousedown',e=>{if(e.button===0&&!shop&&!dead){mouse=true;shoot()}});document.addEventListener('mouseup',e=>{if(e.button===0)mouse=false});document.addEventListener('mousemove',e=>{if(!shop&&!dead){player.ry-=e.movementX*.003;player.rx=THREE.MathUtils.clamp(player.rx-e.movementY*.003,-1.4,1.4)}});document.getElementById('closeShop').onclick=toggleShop;document.getElementById('restart').onclick=reset;const clock=new THREE.Clock();function updateEnemies(dt){const now=performance.now();for(const e of enemies){const d=new THREE.Vector3().subVectors(player.p,e.position);d.y=0;const dist=d.length();if(dist>3.1){d.normalize();e.position.addScaledVector(d,dt*e.userData.speed)}else if(now-e.userData.last>=e.userData.delay){e.userData.last=now;hit(e.userData.damage)}}}function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(!shop&&!dead){const f=new THREE.Vector3(-Math.sin(player.ry),0,-Math.cos(player.ry)),r=new THREE.Vector3(Math.cos(player.ry),0,-Math.sin(player.ry)),m=new THREE.Vector3();if(keys.KeyW)m.add(f);if(keys.KeyS)m.sub(f);if(keys.KeyD)m.add(r);if(keys.KeyA)m.sub(r);if(m.lengthSq())m.normalize().multiplyScalar(player.speed*dt);player.p.add(m);player.vy-=25*dt;player.p.y+=player.vy*dt;if(player.p.y<=2){player.p.y=2;player.vy=0;player.jump=true}player.p.x=THREE.MathUtils.clamp(player.p.x,-65,65);player.p.z=THREE.MathUtils.clamp(player.p.z,-65,65);updateEnemies(dt);if(mouse)shoot()}camera.position.copy(player.p);camera.rotation.y=player.ry;camera.rotation.x=player.rx;renderer.render(scene,camera);ui()}buildGun();spawnWave();animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})</script></body></html>
