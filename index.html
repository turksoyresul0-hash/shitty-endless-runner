<!doctype html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FPS Arena</title><style>html,body{margin:0;height:100%;overflow:hidden;font-family:Arial;background:#111}#hud{position:fixed;z-index:5;top:14px;left:14px;color:white;font-size:18px;line-height:1.45;text-shadow:2px 2px 4px #000}#cross{position:fixed;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px;color:#fff}#msg{position:fixed;z-index:6;top:12%;left:50%;transform:translateX(-50%);color:#fff;font-size:25px;font-weight:bold;text-shadow:2px 2px 5px #000}.modal{display:none;position:fixed;z-index:20;inset:0;background:#000b;align-items:center;justify-content:center;color:#fff}.panel{background:#171b22;padding:24px;border-radius:16px;text-align:center;min-width:310px;box-shadow:0 10px 40px #000}.panel button{padding:11px 20px;margin:6px;border:0;border-radius:8px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:#272d36;padding:12px;border-radius:10px}.card button{width:100%}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script></head><body><div id="cross">+</div><div id="hud">❤️ HP: <b id="hp">100</b><br>🔫 <b id="wep">Pistol</b> | <b id="ammo">12</b>/<b id="res">72</b><br>💰 <b id="money">0</b><br>🌊 Dalga: <b id="wave">1</b> | 👾 <b id="cnt">0</b><br><small>WASD • SPACE • Sol tık • R • 1/2/3 • B</small></div><div id="msg"></div><div id="shop" class="modal"><div class="panel"><h2>🔫 SİLAH MAĞAZASI</h2><p>Para: <b id="smoney">0</b></p><div id="shopgrid" class="grid"></div><button id="close">Kapat</button></div></div><div id="over" class="modal"><div class="panel"><h1>💀 OYUN BİTTİ</h1><p>Dalga <b id="fw">1</b> • Öldürme <b id="fk">0</b></p><button id="restart">TEKRAR OYNA</button></div></div><script type="module">import*as THREE from'three';const scene=new THREE.Scene();scene.background=new THREE.Color(0x82bce8);scene.fog=new THREE.Fog(0x82bce8,35,170);const camera=new THREE.PerspectiveCamera(74,innerWidth/innerHeight,.1,500);camera.rotation.order='YXZ';const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xbfe8ff,0x40502d,1.4));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(30,55,20);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.82})}const ground=new THREE.Mesh(new THREE.PlaneGeometry(240,240),mat(0x497b3b));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);const grid=new THREE.GridHelper(220,44,0x315c2b,0x5c8f4d);grid.position.y=.015;scene.add(grid);const road=new THREE.Mesh(new THREE.PlaneGeometry(14,220),mat(0x303238));road.rotation.x=-Math.PI/2;road.position.y=.025;scene.add(road);for(let z=-105;z<=105;z+=10){const line=new THREE.Mesh(new THREE.PlaneGeometry(.45,5),mat(0xd8c85c));line.rotation.x=-Math.PI/2;line.position.set(0,.04,z);scene.add(line)}function box(x,y,z,w,h,d,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m)}for(let i=-90;i<=90;i+=30){box(-24,4,i,10,8,18,0x6b7785);box(24,5,i,12,10,18,0x7d5d4d)}box(0,3,-110,240,6,2,0x44484b);box(0,3,110,240,6,2,0x44484b);box(-110,3,0,2,6,220,0x44484b);box(110,3,0,2,6,220,0x44484b);const player={p:new THREE.Vector3(0,2,12),ry:0,rx:0,vy:0,jump:true,hp:100,money:0,speed:8},keys={},enemies=[];let wave=1,kills=0,dead=false,shop=false,mouse=false,last=0,next=null,reloading=false,current='pistol';const W={pistol:{name:'Pistol',price:0,damage:50,delay:260,mag:12,res:72,reload:650,recoil:.018,pellets:1,spread:.002,c:0x222222},shotgun:{name:'Shotgun',price:700,damage:28,delay:650,mag:6,res:36,reload:900,recoil:.045,pellets:7,spread:.045,c:0x5b321e},sniper:{name:'Sniper',price:1200,damage:140,delay:900,mag:5,res:20,reload:1100,recoil:.055,pellets:1,spread:.001,c:0x263238}};let owned=JSON.parse(localStorage.getItem('owned')||'["pistol"]'),ammo=JSON.parse(localStorage.getItem('ammo')||'null')||{};for(const k in W)ammo[k]??={ammo:W[k].mag,res:W[k].res};const gun=new THREE.Group();camera.add(gun);scene.add(camera);const $=id=>document.getElementById(id);function save(){localStorage.setItem('owned',JSON.stringify(owned));localStorage.setItem('ammo',JSON.stringify(ammo))}function ui(){$('hp').textContent=Math.max(0,player.hp|0);$('money').textContent=player.money;$('wep').textContent=W[current].name;$('ammo').textContent=ammo[current].ammo;$('res').textContent=ammo[current].res;$('wave').textContent=wave;$('cnt').textContent=enemies.length;$('smoney').textContent=player.money}function notice(t){$('msg').textContent=t;clearTimeout(notice.t);notice.t=setTimeout(()=>$('msg').textContent='',900)}function buildGun(){gun.clear();const w=W[current];const body=new THREE.Mesh(new THREE.BoxGeometry(current==='sniper'?.28:.35,.22,current==='sniper'?1.05:.72),new THREE.MeshStandardMaterial({color:w.c,metalness:.7,roughness:.25}));body.position.set(.36,-.32,-.72);gun.add(body);const barrel=new THREE.Mesh(new THREE.CylinderGeometry(.055,.055,current==='sniper'?1.1:.6,12),new THREE.MeshStandardMaterial({color:0x111111,metalness:.8}));barrel.rotation.x=Math.PI/2;barrel.position.set(.36,-.28,-1.1);gun.add(barrel)}function select(k){if(!owned.includes(k)){notice('Bu silahı önce satın al!');return}current=k;buildGun();renderShop();ui()}function reload(){const w=W[current],a=ammo[current];if(reloading||dead||a.ammo>=w.mag||a.res<=0)return;reloading=true;notice('YENİDEN YÜKLE...');setTimeout(()=>{let n=Math.min(w.mag-a.ammo,a.res);a.ammo+=n;a.res-=n;reloading=false;save();ui()},w.reload)}function shoot(){const w=W[current],a=ammo[current],now=performance.now();if(shop||dead||reloading||now-last<w.delay)return;if(a.ammo<=0)return reload();last=now;a.ammo--;player.rx=THREE.MathUtils.clamp(player.rx+w.recoil,-1.35,1.35);gun.position.z=.1;setTimeout(()=>gun.position.z=0,70);const ray=new THREE.Raycaster();for(let i=0;i<w.pellets;i++){ray.setFromCamera(new THREE.Vector2((Math.random()-.5)*w.spread,(Math.random()-.5)*w.spread),camera);const h=ray.intersectObjects(enemies,true)[0];if(h)hurtEnemy(h.object,w.damage)}save();ui()}function human(x,z){const g=new THREE.Group();g.position.set(x,0,z);const skin=mat(0xf0b58a),shirt=mat(0x1f5faa),pants=mat(0x20252c);const body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,1.0,8,16),shirt);body.position.y=1.45;body.scale.set(1,1.15,.7);body.castShadow=true;body.userData.enemy=true;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.38,16,12),skin);head.position.y=2.55;head.castShadow=true;head.userData.enemy=true;g.add(head);for(const s of[-1,1]){const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.7,6,10),skin);arm.position.set(s*.62,1.55,0);arm.rotation.z=s*.22;arm.castShadow=true;arm.userData.enemy=true;g.add(arm);const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.16,.75,6,10),pants);leg.position.set(s*.25,.55,0);leg.castShadow=true;leg.userData.enemy=true;g.add(leg)}const eye=mat(0x111111);for(const s of[-1,1]){const e=new THREE.Mesh(new THREE.SphereGeometry(.045,8,8),eye);e.position.set(s*.13,2.62,-.34);g.add(e)}g.userData={enemy:true,hp:100+(wave-1)*20,speed:2+Math.min((wave-1)*.12,2.2),damage:5+Math.floor((wave-1)/3),delay:850-Math.min((wave-1)*20,350),last:0};scene.add(g);enemies.push(g)}function spawn(){for(let i=0;i<Math.min(3+wave*2,28);i++){const a=Math.random()*Math.PI*2,d=32+Math.random()*38;human(Math.cos(a)*d,Math.sin(a)*d)}notice('DALGA '+wave+' BAŞLADI');ui()}function hurtEnemy(part,d){const e=part.parent?.userData.enemy?part.parent:part;if(!e?.userData.enemy)return;e.userData.hp-=d;if(e.userData.hp<=0){scene.remove(e);enemies.splice(enemies.indexOf(e),1);kills++;player.money+=100+wave*10;if(!enemies.length&&!next){player.money+=150+wave*50;notice('DALGA TEMİZ!');next=setTimeout(()=>{wave++;next=null;spawn()},2200)}}ui()}function damage(d){if(dead)return;player.hp-=d;if(player.hp<=0){dead=true;$('fw').textContent=wave;$('fk').textContent=kills;$('over').style.display='flex'}}function renderShop(){const g=$('shopgrid');g.innerHTML='';for(const[k,w]of Object.entries(W)){const d=document.createElement('div');d.className='card';const has=owned.includes(k);d.innerHTML='<h3>'+w.name+'</h3><p>Hasar '+w.damage+'<br>Şarjör '+w.mag+'<br>Fiyat '+(w.price||'Ücretsiz')+'</p>';const b=document.createElement('button');b.textContent=has?(current===k?'Kullanılıyor':'Kuşan'):'Satın Al';b.disabled=!has&&player.money<w.price;b.onclick=()=>{if(has)select(k);else{player.money-=w.price;owned.push(k);save();renderShop();ui()}};d.appendChild(b);g.appendChild(d)}}function toggle(){if(dead)return;shop=!shop;$('shop').style.display=shop?'flex':'none';renderShop()}function reset(){if(next)clearTimeout(next);for(const e of enemies)scene.remove(e);enemies.length=0;wave=1;kills=0;dead=false;shop=false;player.hp=100;player.money=0;player.p.set(0,2,12);player.ry=player.rx=player.vy=0;for(const k in W)ammo[k]={ammo:W[k].mag,res:W[k].res};$('over').style.display='none';buildGun();save();spawn();ui()}addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'&&player.jump&&!shop&&!dead){player.vy=9;player.jump=false}if(e.code==='KeyR')reload();if(e.code==='KeyB')toggle();if(e.code==='Digit1')select('pistol');if(e.code==='Digit2')select('shotgun');if(e.code==='Digit3')select('sniper')});addEventListener('keyup',e=>keys[e.code]=false);addEventListener('mousedown',e=>{if(e.button===0&&!shop&&!dead){mouse=true;shoot()}});addEventListener('mouseup',e=>{if(e.button===0)mouse=false});addEventListener('mousemove',e=>{if(!shop&&!dead){player.ry-=e.movementX*.003;player.rx=THREE.MathUtils.clamp(player.rx-e.movementY*.003,-1.35,1.35)}});$('close').onclick=toggle;$('restart').onclick=reset;const clock=new THREE.Clock();function enemyUpdate(dt){const now=performance.now();for(const e of enemies){const d=new THREE.Vector3().subVectors(player.p,e.position);d.y=0;const dist=d.length();if(dist>2.8){d.normalize();e.position.addScaledVector(d,dt*e.userData.speed);e.rotation.y=Math.atan2(d.x,d.z)}else if(now-e.userData.last>=e.userData.delay){e.userData.last=now;damage(e.userData.damage)}}}function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);if(!shop&&!dead){const f=new THREE.Vector3(-Math.sin(player.ry),0,-Math.cos(player.ry)),r=new THREE.Vector3(Math.cos(player.ry),0,-Math.sin(player.ry)),m=new THREE.Vector3();if(keys.KeyW)m.add(f);if(keys.KeyS)m.sub(f);if(keys.KeyD)m.add(r);if(keys.KeyA)m.sub(r);if(m.lengthSq())m.normalize().multiplyScalar(player.speed*dt);player.p.add(m);player.vy-=25*dt;player.p.y+=player.vy*dt;if(player.p.y<=2){player.p.y=2;player.vy=0;player.jump=true}player.p.x=THREE.MathUtils.clamp(player.p.x,-105,105);player.p.z=THREE.MathUtils.clamp(player.p.z,-105,105);enemyUpdate(dt);if(mouse)shoot()}camera.position.copy(player.p);camera.rotation.y=player.ry;camera.rotation.x=player.rx;renderer.render(scene,camera);ui()}buildGun();spawn();loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})</script></body></html>
