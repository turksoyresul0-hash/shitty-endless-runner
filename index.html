<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FPS Arena</title><style>html,body{margin:0;height:100%;overflow:hidden;font-family:Arial;background:#111}#hud{position:fixed;z-index:5;top:14px;left:14px;color:#fff;font-size:18px;line-height:1.45;text-shadow:2px 2px 4px #000}#cross{position:fixed;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);font-size:25px;color:#fff}#msg{position:fixed;z-index:6;top:12%;left:50%;transform:translateX(-50%);color:#fff;font-size:25px;font-weight:bold;text-shadow:2px 2px 5px #000}.hit{position:fixed;inset:0;z-index:7;pointer-events:none;border:0 solid #f22;box-sizing:border-box;transition:.08s}.modal{display:none;position:fixed;z-index:20;inset:0;background:#000b;align-items:center;justify-content:center;color:#fff}.panel{background:#171b22;padding:24px;border-radius:16px;text-align:center;min-width:310px}.panel button{padding:11px 20px;margin:6px;border:0;border-radius:8px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:#272d36;padding:12px;border-radius:10px}.card button{width:100%}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script></head><body><div id="cross">+</div><div id="hud">❤️ HP: <b id="hp">100</b><br>🔫 <b id="wep">Pistol</b> | <b id="ammo">12</b>/<b id="res">72</b><br>💰 <b id="money">0</b><br>🌊 Dalga: <b id="wave">1</b> | 👾 <b id="cnt">0</b><br><small>WASD • SPACE • Sol tık • R • 1/2/3 • B</small></div><div id="msg"></div><div id="hit" class="hit"></div><div id="shop" class="modal"><div class="panel"><h2>🔫 SİLAH MAĞAZASI</h2><p>Para: <b id="smoney">0</b></p><div id="shopgrid" class="grid"></div><button id="close">Kapat</button></div></div><div id="over" class="modal"><div class="panel"><h1>💀 OYUN BİTTİ</h1><p>Dalga <b id="fw">1</b> • Öldürme <b id="fk">0</b></p><button id="restart">TEKRAR OYNA</button></div></div><script type="module">import*as THREE from'three';const scene=new THREE.Scene();scene.background=new THREE.Color(0x79b7df);scene.fog=new THREE.Fog(0x79b7df,45,180);const camera=new THREE.PerspectiveCamera(74,innerWidth/innerHeight,.1,600);camera.rotation.order='YXZ';const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xd8efff,0x34452c,1.7));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(40,70,25);sun.castShadow=true;scene.add(sun);const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.75});const ground=new THREE.Mesh(new THREE.PlaneGeometry(260,260),M(0x4f833e));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);scene.add(new THREE.GridHelper(250,50,0x2d5728,0x6d9b5b));const road=new THREE.Mesh(new THREE.PlaneGeometry(18,240),M(0x292d31));road.rotation.x=-Math.PI/2;road.position.y=.03;scene.add(road);for(let z=-115;z<=115;z+=10){const q=new THREE.Mesh(new THREE.PlaneGeometry(.42,5),M(0xe3d26a));q.rotation.x=-Math.PI/2;q.position.set(0,.045,z);scene.add(q)}function box(x,y,z,w,h,d,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);m.castShadow=true;scene.add(m)}for(let z=-90;z<=90;z+=30){box(-28,4,z,14,8,18,0x687887);box(28,5,z,14,10,18,0x795c49)}const player={p:new THREE.Vector3(0,2,12),ry:0,rx:0,vy:0,jump:true,hp:100,money:0,speed:8},keys={},enemies=[],effects=[],enemyShots=[],pickups=[];let wave=1,kills=0,dead=false,shop=false,mouse=false,last=0,next=null,reloading=false,current='pistol',camKick=0;const W={pistol:{name:'Pistol',price:0,damage:50,delay:260,mag:12,res:72,reload:650,recoil:.018,pellets:1,spread:.002,c:0x222222},shotgun:{name:'Shotgun',price:700,damage:28,delay:650,mag:6,res:36,reload:900,recoil:.045,pellets:7,spread:.045,c:0x5b321e},sniper:{name:'Sniper',price:1200,damage:140,delay:900,mag:5,res:20,reload:1100,recoil:.055,pellets:1,spread:.001,c:0x263238}};let owned=JSON.parse(localStorage.getItem('owned')||'["pistol"]'),ammo=JSON.parse(localStorage.getItem('ammo')||'null')||{};for(const k in W)ammo[k]??={ammo:W[k].mag,res:W[k].res};const gun=new THREE.Group();camera.add(gun);scene.add(camera);const muzzle=new THREE.PointLight(0xffb347,0,4);camera.add(muzzle);const $=id=>document.getElementById(id);function save(){localStorage.setItem('owned',JSON.stringify(owned));localStorage.setItem('ammo',JSON.stringify(ammo))}function ui(){$('hp').textContent=Math.max(0,player.hp|0);$('money').textContent=player.money;$('wep').textContent=W[current].name;$('ammo').textContent=ammo[current].ammo;$('res').textContent=ammo[current].res;$('wave').textContent=wave;$('cnt').textContent=enemies.length;$('smoney').textContent=player.money}function notice(t){$('msg').textContent=t;clearTimeout(notice.t);notice.t=setTimeout(()=>$('msg').textContent='',1000)}function spark(pos,color=0xffaa33,n=8){for(let i=0;i<n;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.035,.06,6),new THREE.MeshBasicMaterial({color}));m.position.copy(pos);m.userData.v=new THREE.Vector3((Math.random()-.5)*5,Math.random()*4,(Math.random()-.5)*5);m.userData.life=.25+Math.random()*.25;scene.add(m);effects.push(m)}}function tracer(a,b,color=0xffe9a3,life=.06){const g=new THREE.BufferGeometry().setFromPoints([a,b]);const l=new THREE.Line(g,new THREE.LineBasicMaterial({color,transparent:true,opacity:.9}));scene.add(l);l.userData.life=life;effects.push(l)}function buildGun(){gun.clear();const w=W[current];const body=new THREE.Mesh(new THREE.BoxGeometry(current==='sniper'?.28:.36,.24,current==='sniper'?1.05:.72),new THREE.MeshStandardMaterial({color:w.c,metalness:.75,roughness:.25}));body.position.set(.36,-.32,-.72);gun.add(body);const barrel=new THREE.Mesh(new THREE.CylinderGeometry(.055,.055,current==='sniper'?1.1:.62,14),new THREE.MeshStandardMaterial({color:0x111111,metalness:.9}));barrel.rotation.x=Math.PI/2;barrel.position.set(.36,-.28,-1.1);gun.add(barrel);const grip=new THREE.Mesh(new THREE.BoxGeometry(.16,.42,.2),M(0x151515));grip.position.set(.36,-.55,-.62);grip.rotation.x=-.25;gun.add(grip);const skin=M(0xc9825c),sleeve=M(0x293d55);for(const s of[-1,1]){const a=new THREE.Mesh(new THREE.CapsuleGeometry(.09,.48,6,10),sleeve);a.position.set(.34+s*.16,-.48,-.48);a.rotation.z=s*.28;a.rotation.x=-.35;gun.add(a);const h=new THREE.Mesh(new THREE.SphereGeometry(.115,10,8),skin);h.position.set(.34+s*.16,-.56,-.75);gun.add(h)}}function select(k){if(!owned.includes(k)){notice('Bu silahı önce satın al!');return}current=k;buildGun();renderShop();ui()}function reload(){const w=W[current],a=ammo[current];if(reloading||dead||a.ammo>=w.mag||a.res<=0)return;reloading=true;notice('🔄 YENİDEN DOLDURULUYOR...');gun.position.y=-.35;setTimeout(()=>{const n=Math.min(w.mag-a.ammo,a.res);a.ammo+=n;a.res-=n;reloading=false;gun.position.y=0;save();ui()},w.reload)}function shoot(){const w=W[current],a=ammo[current],now=performance.now();if(shop||dead||reloading||now-last<w.delay)return;if(a.ammo<=0)return reload();last=now;a.ammo--;camKick=w.recoil*1.5;gun.position.z=.16;setTimeout(()=>gun.position.z=0,75);muzzle.intensity=7;setTimeout(()=>muzzle.intensity=0,55);const start=camera.getWorldPosition(new THREE.Vector3()),ray=new THREE.Raycaster();for(let i=0;i<w.pellets;i++){ray.setFromCamera(new THREE.Vector2((Math.random()-.5)*w.spread,(Math.random()-.5)*w.spread),camera);const h=ray.intersectObjects(enemies,true)[0];const end=h?h.point:start.clone().add(ray.ray.direction.clone().multiplyScalar(120));tracer(start,end);if(h){spark(h.point,0xff5533,7);hurtEnemy(h.object,w.damage)}}save();ui()}function human(x,z){const g=new THREE.Group();g.position.set(x,0,z);const skin=M(0xc9825c),shirt=M(0x263c66),pants=M(0x20242b);const add=(o,y)=>{o.position.y=y;o.castShadow=true;o.userData.enemyHit=true;g.add(o)};add(new THREE.Mesh(new THREE.CapsuleGeometry(.42,.85,8,16),shirt),1.5);add(new THREE.Mesh(new THREE.BoxGeometry(.72,.75,.56),M(0x343a40)),1.55);add(new THREE.Mesh(new THREE.SphereGeometry(.36,20,16),skin),2.58);add(new THREE.Mesh(new THREE.SphereGeometry(.39,20,10,0,Math.PI*2,0,Math.PI*.55),M(0x263326)),2.72);for(const s of[-1,1]){const a=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.72,7,10),shirt);a.position.set(s*.58,1.52,0);a.rotation.z=s*.18;a.castShadow=true;a.userData.enemyHit=true;g.add(a);const l=new THREE.Mesh(new THREE.CapsuleGeometry(.16,.78,7,10),pants);l.position.set(s*.22,.55,0);l.castShadow=true;l.userData.enemyHit=true;g.add(l)}const eg=new THREE.Mesh(new THREE.BoxGeometry(.13,.13,.7),M(0x111111));eg.position.set(.48,1.48,-.25);eg.rotation.x=Math.PI/2;eg.userData.enemyHit=true;g.add(eg);g.userData={enemy:true,hp:100+(wave-1)*20,speed:2+Math.min((wave-1)*.12,2.2),damage:5+Math.floor((wave-1)/3),delay:1100-Math.min((wave-1)*25,500),last:0};scene.add(g);enemies.push(g)}function makePickup(x,z){const g=new THREE.Group();g.position.set(x,.65,z);const base=new THREE.Mesh(new THREE.BoxGeometry(1.4,.35,.8),M(0x20252a));const boxm=new THREE.Mesh(new THREE.BoxGeometry(.9,.32,.58),M(0x56616b));boxm.position.y=.28;g.add(base,boxm);const glow=new THREE.Mesh(new THREE.BoxGeometry(.65,.12,.4),new THREE.MeshBasicMaterial({color:0x35ff76}));glow.position.y=.48;g.add(glow);g.userData={pickup:true,bob:Math.random()*6,amount:0};scene.add(g);pickups.push(g)}function spawnPickups(){for(let i=0;i<3;i++){const a=Math.random()*Math.PI*2,d=12+Math.random()*55;makePickup(Math.cos(a)*d,Math.sin(a)*d)}}function spawn(){for(let i=0;i<Math.min(3+wave*2,28);i++){const a=Math.random()*Math.PI*2,d=32+Math.random()*38;human(Math.cos(a)*d,Math.sin(a)*d)}if(wave%2===1)spawnPickups();notice('DALGA '+wave+' BAŞLADI');ui()}function hurtEnemy(part,d){let e=part;while(e&&e.parent&&!e.userData.enemy)e=e.parent;if(!e||!e.userData.enemy)return;e.userData.hp-=d;notice('🎯 VURULDU! '+Math.max(0,Math.ceil(e.userData.hp))+' HP');if(e.userData.hp<=0){spark(e.position.clone().add(new THREE.Vector3(0,1.5,0)),0xff3333,18);scene.remove(e);enemies.splice(enemies.indexOf(e),1);kills++;player.money+=100+wave*10;notice('💀 DÜŞMAN ÖLDÜ!');if(!enemies.length&&!next){player.money+=150+wave*50;notice('DALGA TEMİZ!');next=setTimeout(()=>{wave++;next=null;spawn()},2200)}}ui()}function damage(d){if(dead)return;player.hp-=d;$('hit').style.border='8px solid rgba(255,0,0,.75)';clearTimeout(damage.t);damage.t=setTimeout(()=>$('hit').style.border='0 solid transparent',130);camKick-=.025;notice('💥 VURULDUN! -'+d);if(player.hp<=0){dead=true;$('fw').textContent=wave;$('fk').textContent=kills;$('over').style.display='flex'}}function enemyFire(e){const start=e.position.clone().add(new THREE.Vector3(.48,1.5,-.7)),dir=player.p.clone().sub(start).normalize();const b=new THREE.Mesh(new THREE.SphereGeometry(.07,8,8),new THREE.MeshBasicMaterial({color:0xff4b32}));b.position.copy(start);b.userData.v=dir.multiplyScalar(28);b.userData.life=3;scene.add(b);enemyShots.push(b);tracer(start,start.clone().add(dir.clone().multiplyScalar(1.4)),0xff4b32,.12)}function updateEnemyShots(dt){for(let i=enemyShots.length-1;i>=0;i--){const b=enemyShots[i];b.userData.life-=dt;b.position.addScaledVector(b.userData.v,dt);if(b.userData.life<=0){scene.remove(b);enemyShots.splice(i,1);continue}if(b.position.distanceTo(player.p)<.75){spark(b.position,0xff3322,9);scene.remove(b);enemyShots.splice(i,1);damage(8+Math.floor(wave/3))}}}function updatePickups(dt){for(let i=pickups.length-1;i>=0;i--){const p=pickups[i];p.userData.bob+=dt*3;p.position.y=.65+Math.sin(p.userData.bob)*.12;if(p.position.distanceTo(player.p)<2.2){const w=W[current];ammo[current].res=Math.min(w.res*3,ammo[current].res+w.res);save();notice('📦 ŞARJÖR ALINDI! +'+w.res+' YEDEK MERMİ');scene.remove(p);pickups.splice(i,1);ui()}}}function renderShop(){const g=$('shopgrid');g.innerHTML='';for(const[k,w]of Object.entries(W)){const d=document.createElement('div');d.className='card';const has=owned.includes(k);d.innerHTML='<h3>'+w.name+'</h3><p>Hasar '+w.damage+'<br>Şarjör '+w.mag+'<br>Fiyat '+(w.price||'Ücretsiz')+'</p>';const b=document.createElement('button');b.textContent=has?(current===k?'Kullanılıyor':'Kuşan'):'Satın Al';b.disabled=!has&&player.money<w.price;b.onclick=()=>{if(has)select(k);else{player.money-=w.price;owned.push(k);save();renderShop();ui()}};d.appendChild(b);g.appendChild(d)}}function toggle(){if(dead)return;shop=!shop;$('shop').style.display=shop?'flex':'none';renderShop()}function reset(){if(next)clearTimeout(next);for(const e of enemies)scene.remove(e);for(const b of enemyShots)scene.remove(b);for(const p of pickups)scene.remove(p);enemies.length=0;enemyShots.length=0;pickups.length=0;wave=1;kills=0;dead=false;shop=false;player.hp=100;player.money=0;player.p.set(0,2,12);player.ry=player.rx=player.vy=0;$('over').style.display='none';buildGun();spawn();ui()}addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'&&player.jump&&!shop&&!dead){player.vy=9;player.jump=false}if(e.code==='KeyR')reload();if(e.code==='KeyB')toggle();if(e.code==='Digit1')select('pistol');if(e.code==='Digit2')select('shotgun');if(e.code==='Digit3')select('sniper')});addEventListener('keyup',e=>keys[e.code]=false);addEventListener('mousedown',e=>{if(e.button===0&&!shop&&!dead){mouse=true;shoot()}});addEventListener('mouseup',e=>{if(e.button===0)mouse=false});addEventListener('mousemove',e=>{if(!shop&&!dead){player.ry-=e.movementX*.003;player.rx=THREE.MathUtils.clamp(player.rx-e.movementY*.003,-1.35,1.35)}});$('close').onclick=toggle;$('restart').onclick=reset;const clock=new THREE.Clock();function enemyUpdate(dt){const now=performance.now();for(const e of enemies){const d=new THREE.Vector3().subVectors(player.p,e.position);d.y=0;const dist=d.length();if(dist>10){d.normalize();e.position.addScaledVector(d,dt*e.userData.speed);e.rotation.y=Math.atan2(d.x,d.z)}else{e.rotation.y=Math.atan2(d.x,d.z);if(now-e.userData.last>=e.userData.delay){e.userData.last=now;enemyFire(e)}}if(dist<2.5&&now-e.userData.last>350)damage(e.userData.damage)}}function updateEffects(dt){for(let i=effects.length-1;i>=0;i--){const e=effects[i];e.userData.life-=dt;if(e.userData.v)e.position.addScaledVector(e.userData.v,dt);if(e.userData.life<=0){scene.remove(e);effects.splice(i,1)}}}function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);if(!shop&&!dead){const f=new THREE.Vector3(-Math.sin(player.ry),0,-Math.cos(player.ry)),r=new THREE.Vector3(Math.cos(player.ry),0,-Math.sin(player.ry)),m=new THREE.Vector3();if(keys.KeyW)m.add(f);if(keys.KeyS)m.sub(f);if(keys.KeyD)m.add(r);if(keys.KeyA)m.sub(r);if(m.lengthSq())m.normalize().multiplyScalar(player.speed*dt);player.p.add(m);player.vy-=25*dt;player.p.y+=player.vy*dt;if(player.p.y<=2){player.p.y=2;player.vy=0;player.jump=true}player.p.x=THREE.MathUtils.clamp(player.p.x,-115,115);player.p.z=THREE.MathUtils.clamp(player.p.z,-115,115);enemyUpdate(dt);updateEnemyShots(dt);updatePickups(dt);if(mouse)shoot()}camKick*=Math.pow(.001,dt);camera.position.copy(player.p);camera.rotation.y=player.ry;camera.rotation.x=player.rx+camKick;updateEffects(dt);renderer.render(scene,camera);ui()}buildGun();spawn();loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})</script></body></html>
