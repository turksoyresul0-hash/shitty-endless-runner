<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FPS Arena</title><style>html,body{margin:0;height:100%;overflow:hidden;font-family:Arial;background:#081018;color:#fff}canvas{display:block}#hud{position:fixed;z-index:5;top:12px;left:12px;text-shadow:2px 2px 5px #000;line-height:1.5}.modal{display:none;position:fixed;z-index:20;inset:0;background:#000b;align-items:center;justify-content:center}.panel{background:#121a24;border:1px solid #405269;border-radius:16px;padding:24px;width:min(760px,90vw);max-height:85vh;overflow:auto;text-align:center}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:#202b38;padding:12px;border-radius:10px}.card button,.panel button{padding:10px 18px;margin:5px;border:0;border-radius:8px;font-weight:bold}.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}.setting{background:#182330;padding:12px;border-radius:9px}.cross{position:fixed;z-index:6;left:50%;top:50%;font-size:25px;transform:translate(-50%,-50%);pointer-events:none}.msg{position:fixed;z-index:7;top:11%;left:50%;transform:translateX(-50%);font-size:23px;font-weight:bold;text-shadow:2px 2px 5px #000}.hit{position:fixed;z-index:8;inset:0;border:0 solid #f22;pointer-events:none}@media(max-width:650px){.grid,.settings{grid-template-columns:1fr}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script></head><body><div class="cross">+</div><div id="hud">❤️ <b id="hp">100</b> | 🛡️ <b id="armor">100</b><br>🔫 <b id="wep">Pistol</b> | <b id="ammo">12</b>/<b id="res">72</b><br>💰 <b id="money">0</b> | 🌊 <b id="wave">1</b> | 👾 <b id="cnt">0</b><br><small>WASD SPACE • Sol tık • R • E • 1-6 • B mağaza • O ayarlar • Sağ tık dürbün</small></div><div id="msg" class="msg"></div><div id="hit" class="hit"></div><div id="shop" class="modal"><div class="panel"><h2>🔫 SİLAH MAĞAZASI</h2><p>Para: <b id="smoney">0</b></p><div id="shopgrid" class="grid"></div><button id="closeShop">Kapat</button></div></div><div id="settings" class="modal"><div class="panel"><h2>⚙️ AYARLAR</h2><div class="settings"><div class="setting">🎯 Hassasiyet <input id="sens" type="range" min=".25" max="2.5" step=".05" value="1"><b id="sensv">1.00</b></div><div class="setting">🖼️ Grafik <select id="quality"><option>low</option><option selected>medium</option><option>high</option><option>ultra</option></select></div><div class="setting">📈 FPS <select id="fps"><option>30</option><option selected>60</option><option>90</option><option>120</option><option value="0">Sınırsız</option></select></div><div class="setting">✨ Efekt <select id="fx"><option value="1" selected>Açık</option><option value="0">Kapalı</option></select></div></div><br><button id="closeSettings">Uygula</button></div></div><div id="over" class="modal"><div class="panel"><h1>💀 OYUN BİTTİ</h1><p>Dalga <b id="fw">1</b> • Öldürme <b id="fk">0</b></p><button id="restart">TEKRAR OYNA</button></div></div><script type="module">import*as THREE from'three';const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.08,700),renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});camera.rotation.order='YXZ';renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.appendChild(renderer.domElement);scene.background=new THREE.Color(0x78b8df);scene.fog=new THREE.Fog(0x78b8df,45,230);scene.add(new THREE.HemisphereLight(0xdff4ff,0x26351e,1.7));const sun=new THREE.DirectionalLight(0xffffff,2.8);sun.position.set(40,80,25);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);const M=(c,r=.7,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),M(0x4e873f,.95));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);const road=new THREE.Mesh(new THREE.PlaneGeometry(20,280),M(0x252b31));road.rotation.x=-Math.PI/2;road.position.y=.03;scene.add(road);for(let z=-135;z<140;z+=10){const x=new THREE.Mesh(new THREE.PlaneGeometry(.45,5),M(0xe0c55a));x.rotation.x=-Math.PI/2;x.position.set(0,.04,z);scene.add(x)}function box(x,y,z,w,h,d,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m)}for(let z=-120;z<=120;z+=30){box(-30,4,z,15,8,20,0x687887);box(30,5,z,15,10,20,0x795b49)}for(let i=0;i<28;i++){const x=(Math.random()>.5?1:-1)*(13+Math.random()*45),z=-125+Math.random()*250;box(x,1.4,z,.6,2.8,.6,0x62412c);const t=new THREE.Mesh(new THREE.ConeGeometry(2.3,5,8),M(0x245b31));t.position.set(x,5,z);t.castShadow=true;scene.add(t)}const player={p:new THREE.Vector3(0,2,12),ry:0,rx:0,vy:0,jump:true,hp:100,armor:100,money:0,speed:8},keys={},enemies=[],shots=[],effects=[],pickups=[];let wave=1,kills=0,dead=false,shop=false,settings=false,mouse=false,reloading=false,current='pistol',last=0,camKick=0,next=null,sens=1,cap=60,fx=true,zoom=false,lastFrame=0;const W={pistol:{name:'Pistol',price:0,dmg:50,delay:260,mag:12,res:72,reload:650,recoil:.018,spread:.002,pellets:1,c:0x252525,optic:0},smg:{name:'SMG',price:500,dmg:22,delay:85,mag:30,res:120,reload:850,recoil:.022,spread:.012,pellets:1,c:0x30343a,optic:0},rifle:{name:'AR-15',price:900,dmg:32,delay:115,mag:30,res:150,reload:900,recoil:.024,spread:.007,pellets:1,c:0x31452f,optic:1},shotgun:{name:'Shotgun',price:1200,dmg:28,delay:650,mag:6,res:42,reload:1000,recoil:.055,spread:.052,pellets:8,c:0x5b321e,optic:0},sniper:{name:'Sniper',price:1800,dmg:150,delay:900,mag:5,res:25,reload:1150,recoil:.075,spread:.0008,pellets:1,c:0x263238,optic:3},lmg:{name:'LMG',price:2200,dmg:27,delay:105,mag:60,res:180,reload:1500,recoil:.03,spread:.018,pellets:1,c:0x424b35,optic:1}};let owned=JSON.parse(localStorage.getItem('owned')||'["pistol"]'),ammo=JSON.parse(localStorage.getItem('ammo')||'null')||{};for(const k in W)ammo[k]??={ammo:W[k].mag,res:W[k].res};const $=x=>document.getElementById(x),gun=new THREE.Group();camera.add(gun);scene.add(camera);const muzzle=new THREE.PointLight(0xffa43b,0,5);camera.add(muzzle);function save(){localStorage.setItem('owned',JSON.stringify(owned));localStorage.setItem('ammo',JSON.stringify(ammo));localStorage.setItem('fpsSettings',JSON.stringify({sens,cap,fx}))}function ui(){$('hp').textContent=Math.max(0,player.hp|0);$('armor').textContent=Math.max(0,player.armor|0);$('ammo').textContent=ammo[current].ammo;$('res').textContent=ammo[current].res;$('wep').textContent=W[current].name;$('money').textContent=player.money;$('wave').textContent=wave;$('cnt').textContent=enemies.length;$('smoney').textContent=player.money}function note(t){$('msg').textContent=t;clearTimeout(note.t);note.t=setTimeout(()=>$('msg').textContent='',1200)}function part(g,geo,mat,p,r){const m=new THREE.Mesh(geo,mat);m.position.set(...p);if(r)m.rotation.set(...r);m.castShadow=true;g.add(m);return m}function buildGun(){gun.clear();const w=W[current],g=new THREE.Group(),skin=M(0xc9825c),cloth=M(0x293e58),metal=M(w.c,.28,.7);part(g,new THREE.BoxGeometry(.36,.25,current==='sniper'?1.5:1),metal,[.38,-.3,-.75]);part(g,new THREE.BoxGeometry(.24,.12,current==='sniper'?1:.55),M(0x111,.2,.9),[.38,-.17,-1.03]);part(g,new THREE.CylinderGeometry(.055,.065,current==='sniper'?1.25:current==='shotgun'?1:.72,16),M(0x101214,.18,.95),[.38,-.25,-1.3],[Math.PI/2,0,0]);part(g,new THREE.BoxGeometry(.17,.43,.22),M(0x111,.7),[.38,-.55,-.58],[.18,0,0]);if(w.optic)part(g,new THREE.CylinderGeometry(.075,.075,.38,16),M(0x111,.18,.9),[.38,-.01,-.67],[Math.PI/2,0,0]);if(w.optic>=2)part(g,new THREE.CylinderGeometry(.1,.1,.5,16),M(0x151515,.15,.9),[.38,-.01,-.48],[Math.PI/2,0,0]);for(const s of[-1,1]){part(g,new THREE.CapsuleGeometry(.095,.48,6,10),cloth,[.34+s*.15,-.48,-.48],[-.35,0,s*.28]);part(g,new THREE.SphereGeometry(.115,12,10),skin,[.34+s*.15,-.58,-.76])}gun.add(g)}function select(k){if(!owned.includes(k))return note('Önce satın al!');current=k;zoom=false;buildGun();shopUI();ui()}function reload(){const w=W[current],a=ammo[current];if(reloading||a.ammo>=w.mag||a.res<=0)return;reloading=true;note('🔄 DOLDURULUYOR');gun.rotation.z=.12;setTimeout(()=>{const n=Math.min(w.mag-a.ammo,a.res);a.ammo+=n;a.res-=n;reloading=false;gun.rotation.z=0;save();ui()},w.reload)}function shoot(){const w=W[current],a=ammo[current],now=performance.now();if(shop||settings||dead||reloading||now-last<w.delay)return;if(a.ammo<=0)return reload();last=now;a.ammo--;camKick=w.recoil*(zoom?.45:1.5);gun.position.z=.13;muzzle.intensity=8;setTimeout(()=>{gun.position.z=0;muzzle.intensity=0},60);const start=camera.getWorldPosition(new THREE.Vector3()),ray=new THREE.Raycaster();for(let i=0;i<w.pellets;i++){ray.setFromCamera(new THREE.Vector2((Math.random()-.5)*w.spread*(zoom?.25:1),(Math.random()-.5)*w.spread*(zoom?.25:1)),camera);const h=ray.intersectObjects(enemies,true)[0],end=h?h.point:start.clone().add(ray.ray.direction.clone().multiplyScalar(140));if(fx){const g=new THREE.BufferGeometry().setFromPoints([start,end]);const l=new THREE.Line(g,new THREE.LineBasicMaterial({color:0xffe7a3}));scene.add(l);setTimeout(()=>scene.remove(l),70)}if(h)hurt(h.object,w.dmg)}save();ui()}function human(x,z){const g=new THREE.Group();g.position.set(x,0,z);const skin=M(0xb97956),cloth=M(0x273f63),pants=M(0x20242b),armorM=M(0x3a4248);const add=(o,y)=>{o.position.y=y;o.userData.hit=true;o.castShadow=true;g.add(o)};add(new THREE.CapsuleGeometry?new THREE.Mesh(new THREE.CapsuleGeometry(.43,.8,8,16),cloth):new THREE.Mesh(new THREE.BoxGeometry(.7,1,.5),cloth),1.5);add(new THREE.Mesh(new THREE.BoxGeometry(.76,.72,.58),armorM),1.55);add(new THREE.Mesh(new THREE.SphereGeometry(.36,20,16),skin),2.55);add(new THREE.Mesh(new THREE.SphereGeometry(.39,20,10,0,Math.PI*2,0,Math.PI*.55),M(0x202b20)),2.7);for(const s of[-1,1]){add(new THREE.Mesh(new THREE.CapsuleGeometry(.12,.7,7,10),cloth),1.5);g.children[g.children.length-1].position.x=s*.58;g.children[g.children.length-1].rotation.z=s*.2;const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.15,.72,7,10),pants);leg.position.set(s*.22,.55,0);leg.userData.hit=true;leg.castShadow=true;g.add(leg)}const gunE=new THREE.Group();part(gunE,new THREE.BoxGeometry(.16,.14,.65),M(0x111,.25,.8),[.48,1.48,-.32]);part(gunE,new THREE.CylinderGeometry(.04,.04,.45,10),M(0x090909,.15,.9),[.48,1.46,-.73],[Math.PI/2,0,0]);part(gunE,new THREE.BoxGeometry(.12,.3,.16),M(0x111),[.48,1.25,-.35]);gunE.userData.hit=true;g.add(gunE);g.userData={enemy:true,hp:100+(wave-1)*20,speed:2+Math.min((wave-1)*.12,2.2),damage:5+Math.floor(wave/3),delay:1100-Math.min((wave-1)*25,500),last:0};scene.add(g);enemies.push(g)}function hurt(o,d){let e=o;while(e&&e.parent&&!e.userData.enemy)e=e.parent;if(!e)return;e.userData.hp-=d;if(e.userData.hp<=0){scene.remove(e);enemies.splice(enemies.indexOf(e),1);kills++;player.money+=100+wave*10;note('💀 DÜŞMAN YOK EDİLDİ');if(!enemies.length&&!next)next=setTimeout(()=>{wave++;next=null;spawn()},1800)}}function spawn(){for(let i=0;i<Math.min(3+wave*2,28);i++){const a=Math.random()*6.28,d=32+Math.random()*38;human(Math.cos(a)*d,Math.sin(a)*d)}note('DALGA '+wave);ui()}function enemyFire(e){const start=e.position.clone().add(new THREE.Vector3(.48,1.5,-.8)),dir=player.p.clone().sub(start).normalize();const b=new THREE.Mesh(new THREE.SphereGeometry(.065,8,8),new THREE.MeshBasicMaterial({color:0xff4328}));b.position.copy(start);b.userData.v=dir.multiplyScalar(28);b.userData.life=3;scene.add(b);shots.push(b)}function enemyUpdate(dt){const now=performance.now();for(const e of enemies){const d=new THREE.Vector3().subVectors(player.p,e.position);d.y=0;const dist=d.length();if(dist>10){d.normalize();e.position.addScaledVector(d,dt*e.userData.speed);e.rotation.y=Math.atan2(d.x,d.z)}if(dist<35&&now-e.userData.last>e.userData.delay){e.userData.last=now;enemyFire(e)}}}function shotUpdate(dt){for(let i=shots.length-1;i>=0;i--){const b=shots[i];b.position.addScaledVector(b.userData.v,dt);b.userData.life-=dt;if(b.userData.life<0||b.position.distanceTo(player.p)<.8){if(b.position.distanceTo(player.p)<.8){const block=Math.min(player.armor,6);player.armor-=block;player.hp-=8-block;$('hit').style.border='8px solid #f33';setTimeout(()=>$('hit').style.border='0',100)}scene.remove(b);shots.splice(i,1)}}}function shopUI(){const g=$('shopgrid');g.innerHTML='';for(const[k,w]of Object.entries(W)){const d=document.createElement('div');d.className='card';d.innerHTML='<h3>'+w.name+'</h3><p>Hasar '+w.dmg+'<br>Şarjör '+w.mag+' • Optik '+(w.optic?'VAR':'YOK')+'<br>₺'+w.price+'</p>';const b=document.createElement('button'),has=owned.includes(k);b.textContent=has?(current===k?'Kullanılıyor':'Kuşan'):'Satın Al';b.disabled=!has&&player.money<w.price;b.onclick=()=>has?select(k):(player.money-=w.price,owned.push(k),save(),shopUI(),ui());d.appendChild(b);g.appendChild(d)}}function toggleShop(){shop=!shop;$('shop').style.display=shop?'flex':'none';if(shop){document.exitPointerLock?.();shopUI()}}function toggleSettings(){settings=!settings;$('settings').style.display=settings?'flex':'none';if(settings){document.exitPointerLock?.();$('sens').value=sens;$('sensv').textContent=sens.toFixed(2);$('fps').value=cap;$('fx').value=fx?'1':'0'}}function apply(){sens=+$('sens').value;cap=+$('fps').value;fx=$('fx').value==='1';save();settings=false;$('settings').style.display='none';applyQuality()}function applyQuality(){const q=$('quality').value,px=q==='low'?.75:q==='medium'?1:q==='high'?1.5:2;renderer.setPixelRatio(Math.min(devicePixelRatio,px));renderer.shadowMap.enabled=q!=='low';scene.fog.far=q==='low'?130:q==='medium'?190:q==='high'?245:300}function reset(){location.reload()}addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'&&player.jump&&!shop&&!settings&&!dead){player.vy=9;player.jump=false}if(e.code==='KeyR')reload();if(e.code==='KeyB')toggleShop();if(e.code==='KeyO')toggleSettings();if(e.code==='KeyE')note('E: eşya sistemi hazır');['Digit1','Digit2','Digit3','Digit4','Digit5','Digit6'].includes(e.code)&&select(['pistol','smg','rifle','shotgun','sniper','lmg'][+e.code.slice(-1)-1])});addEventListener('keyup',e=>keys[e.code]=false);renderer.domElement.addEventListener('click',()=>{if(!shop&&!settings&&!dead)renderer.domElement.requestPointerLock?.()});addEventListener('mousedown',e=>{if(e.button===0&&!shop&&!settings&&!dead){mouse=true;shoot()}if(e.button===2&&!shop&&!settings&&!dead&&W[current].optic){zoom=true;camera.fov=40;camera.updateProjectionMatrix()}});addEventListener('mouseup',e=>{if(e.button===0)mouse=false;if(e.button===2){zoom=false;camera.fov=72;camera.updateProjectionMatrix()}});addEventListener('contextmenu',e=>e.preventDefault());addEventListener('mousemove',e=>{if(shop||settings||dead)return;if(document.pointerLockElement===renderer.domElement||mouse){player.ry-=e.movementX*.003*sens;player.rx=THREE.MathUtils.clamp(player.rx-e.movementY*.003*sens,-1.48,1.48)}});$('closeShop').onclick=toggleShop;$('closeSettings').onclick=apply;$('sens').oninput=()=>$('sensv').textContent=(+$('sens').value).toFixed(2);$('restart').onclick=reset;try{const s=JSON.parse(localStorage.getItem('fpsSettings')||'null');if(s){sens=s.sens??1;cap=s.cap??60;fx=s.fx??true}}catch{}$('quality').value='medium';applyQuality();const clock=new THREE.Clock();function loop(t){requestAnimationFrame(loop);if(cap&&t-lastFrame<1000/cap)return;lastFrame=t;const dt=Math.min(clock.getDelta(),.05);if(!shop&&!settings&&!dead){const f=new THREE.Vector3(-Math.sin(player.ry),0,-Math.cos(player.ry)),r=new THREE.Vector3(Math.cos(player.ry),0,-Math.sin(player.ry)),m=new THREE.Vector3();if(keys.KeyW)m.add(f);if(keys.KeyS)m.sub(f);if(keys.KeyD)m.add(r);if(keys.KeyA)m.sub(r);if(m.lengthSq())m.normalize().multiplyScalar(player.speed*dt);player.p.add(m);player.vy-=25*dt;player.p.y+=player.vy*dt;if(player.p.y<=2){player.p.y=2;player.vy=0;player.jump=true}enemyUpdate(dt);shotUpdate(dt);if(mouse)shoot();if(player.hp<=0){dead=true;$('over').style.display='flex';$('fw').textContent=wave;$('fk').textContent=kills}}camera.position.copy(player.p);camera.rotation.y=player.ry;camera.rotation.x=player.rx+camKick;camKick*=Math.pow(.001,dt);renderer.render(scene,camera);ui()}buildGun();spawn();loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})</script></body></html>
