<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FPS Arena - Zırhlı Mod</title><style>html,body{margin:0;height:100%;overflow:hidden;font-family:Arial;background:#111}#hud{position:fixed;z-index:5;top:14px;left:14px;color:#fff;font-size:18px;line-height:1.5;text-shadow:2px 2px 4px #000}.bar{display:inline-block;width:110px;height:10px;background:#222;border-radius:6px;overflow:hidden}.fill{display:block;height:100%}.hp{background:#38e66b}.ar{background:#4aa8ff}#cross{position:fixed;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font-size:25px}#msg{position:fixed;z-index:6;top:12%;left:50%;transform:translateX(-50%);color:#fff;font-size:25px;font-weight:bold;text-shadow:2px 2px 5px #000}.hit{position:fixed;inset:0;z-index:7;pointer-events:none;border:0 solid red;box-sizing:border-box}.modal{display:none;position:fixed;z-index:20;inset:0;background:#000b;align-items:center;justify-content:center;color:#fff}.panel{background:#171b22;padding:24px;border-radius:16px;text-align:center;min-width:310px}.panel button{padding:11px 20px;margin:6px;border:0;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:#272d36;padding:12px;border-radius:10px}.card button{width:100%}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script></head><body><div id="cross">+</div><div id="hud">❤️ HP: <b id="hp">100</b> <span class="bar"><i id="hpbar" class="fill hp" style="width:100%"></i></span><br>🛡️ Zırh: <b id="armor">100</b> <span class="bar"><i id="arbar" class="fill ar" style="width:100%"></i></span><br>🔫 <b id="wep">Pistol</b> | <b id="ammo">12</b>/<b id="res">72</b><br>💰 <b id="money">0</b> | 🌊 Dalga <b id="wave">1</b> | 👾 <b id="cnt">0</b><br><small>WASD • SPACE • Sol tık • R • E • 1/2/3 • B</small></div><div id="msg"></div><div id="hit" class="hit"></div><div id="shop" class="modal"><div class="panel"><h2>🔫 SİLAH MAĞAZASI</h2><p>Para: <b id="smoney">0</b></p><div id="shopgrid" class="grid"></div><button id="close">Kapat</button></div></div><div id="over" class="modal"><div class="panel"><h1>💀 OYUN BİTTİ</h1><p>Dalga <b id="fw">1</b> • Öldürme <b id="fk">0</b></p><button id="restart">TEKRAR OYNA</button></div></div><script type="module">import*as THREE from'three';const S=new THREE.Scene();S.background=new THREE.Color(0x79b7df);S.fog=new THREE.Fog(0x79b7df,45,180);const C=new THREE.PerspectiveCamera(74,innerWidth/innerHeight,.1,600);C.rotation.order='YXZ';const R=new THREE.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;document.body.appendChild(R.domElement);S.add(new THREE.HemisphereLight(0xd8efff,0x34452c,1.7));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(40,70,25);sun.castShadow=true;S.add(sun);const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.72});const gnd=new THREE.Mesh(new THREE.PlaneGeometry(260,260),M(0x4f833e));gnd.rotation.x=-Math.PI/2;gnd.receiveShadow=true;S.add(gnd);S.add(new THREE.GridHelper(250,50,0x2d5728,0x6d9b5b));const road=new THREE.Mesh(new THREE.PlaneGeometry(18,240),M(0x292d31));road.rotation.x=-Math.PI/2;road.position.y=.03;S.add(road);for(let z=-115;z<=115;z+=10){const q=new THREE.Mesh(new THREE.PlaneGeometry(.42,5),M(0xe3d26a));q.rotation.x=-Math.PI/2;q.position.set(0,.045,z);S.add(q)}const box=(x,y,z,w,h,d,c)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);m.castShadow=true;S.add(m)};for(let z=-90;z<=90;z+=30){box(-28,4,z,14,8,18,0x687887);box(28,5,z,14,10,18,0x795c49)}const P={p:new THREE.Vector3(0,2,12),ry:0,rx:0,vy:0,jump:true,hp:100,armor:100,money:0,speed:8},keys={},enemies=[],shots=[],fx=[],items=[];let wave=1,kills=0,dead=false,shop=false,mouse=false,last=0,next=null,reloading=false,current='pistol',kick=0;const W={pistol:{name:'Pistol',price:0,damage:50,delay:260,mag:12,res:72,reload:650,recoil:.018,pellets:1,spread:.002,c:0x222222},shotgun:{name:'Shotgun',price:700,damage:28,delay:650,mag:6,res:36,reload:900,recoil:.045,pellets:7,spread:.045,c:0x5b321e},sniper:{name:'Sniper',price:1200,damage:140,delay:900,mag:5,res:20,reload:1100,recoil:.055,pellets:1,spread:.001,c:0x263238}};let owned=JSON.parse(localStorage.getItem('owned')||'["pistol"]'),ammo=JSON.parse(localStorage.getItem('ammo')||'null')||{};for(const k in W)ammo[k]??={ammo:W[k].mag,res:W[k].res};const gun=new THREE.Group();C.add(gun);S.add(C);const light=new THREE.PointLight(0xffb347,0,4);C.add(light);const $=x=>document.getElementById(x);const save=()=>{localStorage.setItem('owned',JSON.stringify(owned));localStorage.setItem('ammo',JSON.stringify(ammo))};function ui(){$('hp').textContent=P.hp|0;$('armor').textContent=P.armor|0;$('hpbar').style.width=Math.max(0,P.hp)+'%';$('arbar').style.width=Math.max(0,P.armor)+'%';$('money').textContent=P.money;$('wep').textContent=W[current].name;$('ammo').textContent=ammo[current].ammo;$('res').textContent=ammo[current].res;$('wave').textContent=wave;$('cnt').textContent=enemies.length;$('smoney').textContent=P.money}function note(t){$('msg').textContent=t;clearTimeout(note.t);note.t=setTimeout(()=>$('msg').textContent='',1300)}function spark(p,c=0xffaa33,n=8){for(let i=0;i<n;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.035,6,6),new THREE.MeshBasicMaterial({color:c}));m.position.copy(p);m.userData.v=new THREE.Vector3((Math.random()-.5)*5,Math.random()*4,(Math.random()-.5)*5);m.userData.life=.25;S.add(m);fx.push(m)}}function trail(a,b){const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,b]),new THREE.LineBasicMaterial({color:0xffe9a3}));l.userData.life=.06;S.add(l);fx.push(l)}function buildGun(){gun.clear();const w=W[current];const body=new THREE.Mesh(new THREE.BoxGeometry(.36,.24,current==='sniper'?1.05:.72),new THREE.MeshStandardMaterial({color:w.c,metalness:.75,roughness:.25}));body.position.set(.36,-.32,-.72);gun.add(body);const br=new THREE.Mesh(new THREE.CylinderGeometry(.055,.055,current==='sniper'?1.1:.62,14),new THREE.MeshStandardMaterial({color:0x111111,metalness:.9}));br.rotation.x=Math.PI/2;br.position.set(.36,-.28,-1.1);gun.add(br);const skin=M(0xc9825c),sl=M(0x293d55);for(const s of[-1,1]){const a=new THREE.Mesh(new THREE.CapsuleGeometry(.09,.48,6,10),sl);a.position.set(.34+s*.16,-.48,-.48);a.rotation.z=s*.28;a.rotation.x=-.35;gun.add(a);const h=new THREE.Mesh(new THREE.SphereGeometry(.115,10,8),skin);h.position.set(.34+s*.16,-.56,-.75);gun.add(h)}}function select(k){if(!owned.includes(k))return note('Bu silahı önce satın al!');current=k;buildGun();shopUI();ui()}function reload(){const w=W[current],a=ammo[current];if(reloading||dead||a.ammo>=w.mag||!a.res)return;reloading=true;note('🔄 YENİDEN DOLDURULUYOR...');setTimeout(()=>{const n=Math.min(w.mag-a.ammo,a.res);a.ammo+=n;a.res-=n;reloading=false;save();ui()},w.reload)}function shoot(){const w=W[current],a=ammo[current],now=performance.now();if(shop||dead||reloading||now-last<w.delay)return;if(a.ammo<=0)return reload();last=now;a.ammo--;kick=w.recoil*1.5;gun.position.z=.16;setTimeout(()=>gun.position.z=0,75);light.intensity=7;setTimeout(()=>light.intensity=0,55);const start=C.getWorldPosition(new THREE.Vector3()),ray=new THREE.Raycaster();for(let i=0;i<w.pellets;i++){ray.setFromCamera(new THREE.Vector2((Math.random()-.5)*w.spread,(Math.random()-.5)*w.spread),C);const h=ray.intersectObjects(enemies,true)[0];const end=h?h.point:start.clone().add(ray.ray.direction.clone().multiplyScalar(120));trail(start,end);if(h)hitEnemy(h.object,w.damage)}save();ui()}function human(x,z){const g=new THREE.Group();g.position.set(x,0,z);const armorLevel=[0,25,50,75][Math.floor(Math.random()*4)];const armorColor=armorLevel===0?0x343a40:armorLevel===25?0x4b5966:armorLevel===50?0x2e4158:0x555555;const add=(o,y,zone)=>{o.position.y=y;o.castShadow=true;o.userData.enemyHit=true;o.userData.zone=zone;g.add(o)};add(new THREE.Mesh(new THREE.CapsuleGeometry(.42,.85,8,16),M(0x263c66)),1.5,'body');add(new THREE.Mesh(new THREE.BoxGeometry(.82,.72,.58),M(armorColor)),1.55,'body');add(new THREE.Mesh(new THREE.SphereGeometry(.36,18,14),M(0xc9825c)),2.58,'head');const helmet=new THREE.Mesh(new THREE.SphereGeometry(.39,18,10,0,Math.PI*2,0,Math.PI*.58),M(armorLevel>=50?0x202a32:0x263326));helmet.position.y=2.72;helmet.castShadow=true;helmet.userData.enemyHit=true;helmet.userData.zone='head';g.add(helmet);for(const s of[-1,1]){add(new THREE.Mesh(new THREE.CapsuleGeometry(.13,.72,7,10),M(0x263c66)),1.52,'body');g.children[g.children.length-1].position.x=s*.58;g.children[g.children.length-1].rotation.z=s*.18;add(new THREE.Mesh(new THREE.CapsuleGeometry(.16,.78,7,10),M(0x20242b)),.55,'body');g.children[g.children.length-1].position.x=s*.22}const gunm=new THREE.Mesh(new THREE.BoxGeometry(.13,.13,.7),M(0x111111));gunm.position.set(.48,1.48,-.25);gunm.rotation.x=Math.PI/2;gunm.userData.enemyHit=true;gunm.userData.zone='body';g.add(gunm);g.userData={enemy:true,hp:100+(wave-1)*20,armor:armorLevel,speed:2+Math.min((wave-1)*.12,2.2),damage:5+Math.floor((wave-1)/3),delay:1100-Math.min((wave-1)*25,500),last:0};S.add(g);enemies.push(g)}function hitEnemy(part,d){let e=part;while(e&&e.parent&&!e.userData.enemy)e=e.parent;if(!e)return;const head=part.userData.zone==='head';const raw=head?d*2.25:d;const blocked=head?Math.min(e.userData.armor*.25,raw):Math.min(e.userData.armor,raw*.65);e.userData.hp-=Math.max(0,raw-blocked);if(head)note('🎯 KAFADAN VURUŞ! x2.25');else if(blocked>0)note('🛡️ DÜŞMAN ZIRHI -'+Math.ceil(blocked));else note('🎯 VURULDU!');if(e.userData.hp<=0){spark(e.position.clone().add(new THREE.Vector3(0,1.5,0)),0xff3333,18);S.remove(e);enemies.splice(enemies.indexOf(e),1);kills++;P.money+=100+wave*10;if(!enemies.length&&!next){P.money+=150+wave*50;next=setTimeout(()=>{wave++;next=null;spawn()},2200)}}ui()}function pickup(x,z,kind){const g=new THREE.Group();g.position.set(x,.65,z);const c={ammo:0x35ff76,med:0xff3344,armor:0x3399ff}[kind];const b=new THREE.Mesh(new THREE.BoxGeometry(1.3,.35,.8),M(0x20252a));g.add(b);const gl=new THREE.Mesh(new THREE.BoxGeometry(.65,.12,.4),new THREE.MeshBasicMaterial({color:c}));gl.position.y=.25;g.add(gl);g.userData={kind,bob:Math.random()*6};S.add(g);items.push(g)}function spawn(){for(let i=0;i<Math.min(3+wave*2,28);i++){const a=Math.random()*6.28,d=32+Math.random()*38;human(Math.cos(a)*d,Math.sin(a)*d)}for(const k of['ammo','med','armor']){const a=Math.random()*6.28,d=12+Math.random()*55;pickup(Math.cos(a)*d,Math.sin(a)*d,k)}note('DALGA '+wave+' BAŞLADI');ui()}function collect(){if(dead||shop)return;for(let i=items.length-1;i>=0;i--){const p=items[i];if(p.position.distanceTo(P.p)<2.8){const k=p.userData.kind;if(k==='med'){if(P.hp>=100)return note('❤️ CANIN DOLU');P.hp=Math.min(100,P.hp+35);note('❤️ +35 HP')}else if(k==='armor'){if(P.armor>=100)return note('🛡️ ZIRHIN DOLU');P.armor=Math.min(100,P.armor+40);note('🛡️ +40 ZIRH')}else{ammo[current].res=Math.min(W[current].res*3,ammo[current].res+W[current].res);note('📦 MERMİ +'+W[current].res);save()}S.remove(p);items.splice(i,1);ui();return}}note('📦 YAKINDA EŞYA YOK')}function hurt(d){const block=Math.min(P.armor,Math.ceil(d*.65));P.armor-=block;P.hp-=Math.max(0,d-block);$('hit').style.border='8px solid rgba(255,0,0,.7)';setTimeout(()=>$('hit').style.border='0',120);note(block?'🛡️ ZIRH HASARI ENGELLEDİ':'💥 VURULDUN');if(P.hp<=0){dead=true;$('fw').textContent=wave;$('fk').textContent=kills;$('over').style.display='flex'}ui()}function enemyShots(dt){for(let i=shots.length-1;i>=0;i--){const b=shots[i];b.userData.life-=dt;b.position.addScaledVector(b.userData.v,dt);if(b.userData.life<0){S.remove(b);shots.splice(i,1)}else if(b.position.distanceTo(P.p)<.75){S.remove(b);shots.splice(i,1);hurt(8+Math.floor(wave/3))}}}function enemyAI(dt){const n=performance.now();for(const e of enemies){const d=P.p.clone().sub(e.position);d.y=0;const dist=d.length();if(dist>10){d.normalize();e.position.addScaledVector(d,dt*e.userData.speed);e.rotation.y=Math.atan2(d.x,d.z)}else if(n-e.userData.last>e.userData.delay){e.userData.last=n;const st=e.position.clone().add(new THREE.Vector3(.48,1.5,-.7)),dir=P.p.clone().sub(st).normalize();const b=new THREE.Mesh(new THREE.SphereGeometry(.07,8,8),new THREE.MeshBasicMaterial({color:0xff4b32}));b.position.copy(st);b.userData.v=dir.multiplyScalar(28);b.userData.life=3;S.add(b);shots.push(b)}}}function shopUI(){const g=$('shopgrid');g.innerHTML='';for(const[k,w]of Object.entries(W)){const d=document.createElement('div');d.className='card';d.innerHTML='<h3>'+w.name+'</h3><p>Hasar '+w.damage+'<br>Şarjör '+w.mag+'<br>Fiyat '+(w.price||'Ücretsiz')+'</p>';const b=document.createElement('button');const has=owned.includes(k);b.textContent=has?(current===k?'Kullanılıyor':'Kuşan'):'Satın Al';b.disabled=!has&&P.money<w.price;b.onclick=()=>{if(has)select(k);else{P.money-=w.price;owned.push(k);save();shopUI();ui()}};d.appendChild(b);g.appendChild(d)}}function toggle(){if(dead)return;shop=!shop;$('shop').style.display=shop?'flex':'none';shopUI()}function reset(){if(next)clearTimeout(next);enemies.forEach(e=>S.remove(e));shots.forEach(e=>S.remove(e));items.forEach(e=>S.remove(e));enemies.length=shots.length=items.length=0;wave=1;kills=0;dead=false;P.hp=100;P.armor=100;P.money=0;P.p.set(0,2,12);$('over').style.display='none';spawn();ui()}addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'&&P.jump&&!shop&&!dead){P.vy=9;P.jump=false}if(e.code==='KeyR')reload();if(e.code==='KeyE')collect();if(e.code==='KeyB')toggle();if(e.code==='Digit1')select('pistol');if(e.code==='Digit2')select('shotgun');if(e.code==='Digit3')select('sniper')});addEventListener('keyup',e=>keys[e.code]=false);addEventListener('mousedown',e=>{if(e.button===0&&!shop&&!dead){mouse=true;shoot()}});addEventListener('mouseup',e=>{if(e.button===0)mouse=false});addEventListener('mousemove',e=>{if(!shop&&!dead){P.ry-=e.movementX*.003;P.rx=THREE.MathUtils.clamp(P.rx-e.movementY*.003,-1.35,1.35)}});$('close').onclick=toggle;$('restart').onclick=reset;const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);if(!shop&&!dead){const f=new THREE.Vector3(-Math.sin(P.ry),0,-Math.cos(P.ry)),r=new THREE.Vector3(Math.cos(P.ry),0,-Math.sin(P.ry)),m=new THREE.Vector3();if(keys.KeyW)m.add(f);if(keys.KeyS)m.sub(f);if(keys.KeyD)m.add(r);if(keys.KeyA)m.sub(r);if(m.lengthSq())m.normalize().multiplyScalar(P.speed*dt);P.p.add(m);P.vy-=25*dt;P.p.y+=P.vy*dt;if(P.p.y<=2){P.p.y=2;P.vy=0;P.jump=true}P.p.x=THREE.MathUtils.clamp(P.p.x,-115,115);P.p.z=THREE.MathUtils.clamp(P.p.z,-115,115);enemyAI(dt);enemyShots(dt);for(const p of items){p.userData.bob+=dt*3;p.position.y=.65+Math.sin(p.userData.bob)*.12}if(mouse)shoot()}kick*=Math.pow(.001,dt);C.position.copy(P.p);C.rotation.y=P.ry;C.rotation.x=P.rx+kick;R.render(S,C);ui()}buildGun();spawn();loop();addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)})</script></body></html>
