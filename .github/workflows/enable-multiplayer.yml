name: Enable multiplayer client

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch game
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'id="mpPanel"' in s:
              print('Multiplayer patch already present')
              raise SystemExit(0)

          s = s.replace('<div id="msg" class="msg"></div>', '''<div id="msg" class="msg"></div>
          <div id="mpPanel" style="position:fixed;z-index:50;right:14px;top:14px;width:290px;background:#0b1420dd;border:1px solid #4a647d;border-radius:14px;padding:12px;box-shadow:0 8px 30px #0008;font:14px Arial;backdrop-filter:blur(5px)">
            <div style="display:flex;justify-content:space-between;align-items:center"><b>🌐 MULTIPLAYER</b><span id="mpStatus" style="font-size:12px;color:#ffcc66">Bağlanıyor...</span></div>
            <div style="display:flex;gap:6px;margin-top:8px"><input id="mpName" maxlength="24" placeholder="Oyuncu adı" style="flex:1;min-width:0;padding:7px;border-radius:7px;border:1px solid #52687b;background:#172331;color:white"><button id="mpConnect" style="padding:7px 10px;border:0;border-radius:7px;font-weight:bold">BAĞLAN</button></div>
            <div id="mpChat" style="height:110px;overflow:auto;margin-top:8px;padding:6px;background:#050b11aa;border-radius:8px;font-size:12px;text-align:left"></div>
            <div style="display:flex;gap:6px;margin-top:6px"><input id="mpMsg" maxlength="180" placeholder="Mesaj yaz..." style="flex:1;min-width:0;padding:7px;border-radius:7px;border:1px solid #52687b;background:#172331;color:white"><button id="mpSend" style="padding:7px 10px;border:0;border-radius:7px;font-weight:bold">GÖNDER</button></div>
            <div style="margin-top:6px;font-size:11px;opacity:.75">Online: <b id="mpCount">0</b> • WebSocket: Render</div>
          </div>''')

          marker = 'buildGun();spawn();loop();'
          if marker not in s:
              raise SystemExit('game marker not found')

          s = s.replace('const player={p:new THREE.Vector3(0,2,12),ry:0,rx:0,vy:0,jump:true,hp:100,armor:100,money:0,speed:8},', 'const player={p:new THREE.Vector3(0,2,12),ry:0,rx:0,vy:0,jump:true,hp:100,armor:100,money:0,speed:8};window.__fpsPlayer=player;')

          mp = r'''<script type="module">
          import * as THREE from 'three';
          (()=>{
            const URL='wss://fps-arena-server.onrender.com';
            let ws=null,myId=null,connected=false,lastSend=0,reconnect=0;
            const remotes=new Map();
            const $=id=>document.getElementById(id);
            const status=(t,c)=>{if($('mpStatus')){$('mpStatus').textContent=t;$('mpStatus').style.color=c||'#fff'}};
            const chat=(name,text)=>{const d=document.createElement('div');d.innerHTML='<b>'+String(name).replace(/[<>&]/g,'')+':</b> '+String(text).replace(/[<>&]/g,'');$('mpChat').appendChild(d);$('mpChat').scrollTop=$('mpChat').scrollHeight};
            const makeRemote=p=>{
              if(remotes.has(p.id))return remotes.get(p.id);
              const g=new THREE.Group();
              const body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.8,7,12),new THREE.MeshStandardMaterial({color:0x315f8b,roughness:.8}));body.position.y=1.45;g.add(body);
              const head=new THREE.Mesh(new THREE.SphereGeometry(.34,16,12),new THREE.MeshStandardMaterial({color:0xb97956,roughness:.9}));head.position.y=2.48;g.add(head);
              const helmet=new THREE.Mesh(new THREE.SphereGeometry(.37,16,8,0,Math.PI*2,0,Math.PI*.55),new THREE.MeshStandardMaterial({color:0x202b20,roughness:.8}));helmet.position.y=2.62;g.add(helmet);
              for(const side of [-1,1]){const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.11,.65,6,8),new THREE.MeshStandardMaterial({color:0x315f8b,roughness:.8}));arm.position.set(side*.55,1.45,0);arm.rotation.z=side*.18;g.add(arm);const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.14,.7,6,8),new THREE.MeshStandardMaterial({color:0x20252b,roughness:.9}));leg.position.set(side*.2,.52,0);g.add(leg)}
              const gun=new THREE.Group();gun.position.set(.55,1.38,-.55);const gm=new THREE.MeshStandardMaterial({color:0x17191b,roughness:.25,metalness:.75});const barrel=new THREE.Mesh(new THREE.BoxGeometry(.28,.2,1.05),gm);gun.add(barrel);const muzzle=new THREE.PointLight(0xff8a32,0,4);muzzle.position.z=-.7;gun.add(muzzle);g.add(gun);g.userData={id:p.id,target:new THREE.Vector3(p.x,p.y||2,p.z),ry:p.ry||0,hp:p.hp||100,maxHp:100,gun,muzzle,name:p.name||'Oyuncu'};
              const label=document.createElement('div');label.style.cssText='position:fixed;z-index:9;pointer-events:none;color:#fff;font:bold 12px Arial;text-shadow:2px 2px 4px #000;transform:translate(-50%,-50%);';label.textContent=g.userData.name;document.body.appendChild(label);g.userData.label=label;
              window.__fpsGame.scene.add(g);remotes.set(p.id,g);return g;
            };
            const removeRemote=id=>{const g=remotes.get(id);if(!g)return;window.__fpsGame.scene.remove(g);g.userData.label?.remove();remotes.delete(id)};
            const handle=m=>{
              if(m.type==='welcome'){myId=m.id;(m.players||[]).forEach(makeRemote);status('Bağlı','#48e36b');$('mpCount').textContent=remotes.size}
              else if(m.type==='join'){makeRemote(m.player);$('mpCount').textContent=remotes.size;chat('SİSTEM',(m.player.name||'Oyuncu')+' oyuna katıldı')}
              else if(m.type==='leave'){removeRemote(m.id);$('mpCount').textContent=remotes.size;chat('SİSTEM','Bir oyuncu ayrıldı')}
              else if(m.type==='state'){const g=makeRemote(m.player);g.userData.target.set(m.player.x,m.player.y,m.player.z);g.userData.ry=m.player.ry||0;g.userData.hp=m.player.hp||0;if(m.player.name)g.userData.name=m.player.name}
              else if(m.type==='shoot'){const g=remotes.get(m.id);if(g){g.userData.gun.position.z=.16;g.userData.muzzle.intensity=7;setTimeout(()=>{g.userData.gun.position.z=0;g.userData.muzzle.intensity=0},70)}}
              else if(m.type==='chat'){chat(m.name||'Oyuncu',m.text||'')}
              else if(m.type==='name'){const g=remotes.get(m.id);if(g){g.userData.name=m.name;g.userData.label.textContent=m.name}}
            };
            function connect(){
              if(ws&&ws.readyState===1)return;
              status('Bağlanıyor...','#ffcc66');
              try{ws=new WebSocket(URL)}catch(e){status('Hata','#ff6666');return}
              ws.onopen=()=>{connected=true;reconnect=0;status('Bağlı','#48e36b');ws.send(JSON.stringify({type:'name',name:$('mpName').value.trim()||'Oyuncu'}))};
              ws.onmessage=e=>{try{handle(JSON.parse(e.data))}catch{}};
              ws.onclose=()=>{connected=false;status('Yeniden bağlanıyor...','#ff9966');clearTimeout(reconnect);reconnect=setTimeout(connect,2500)};
              ws.onerror=()=>status('Sunucu hatası','#ff6666');
            }
            $('mpConnect').onclick=()=>{if(connected){ws.close();return}connect()};
            $('mpSend').onclick=()=>{const text=$('mpMsg').value.trim();if(text&&ws?.readyState===1){ws.send(JSON.stringify({type:'chat',text}));$('mpMsg').value=''}};
            $('mpMsg').addEventListener('keydown',e=>{if(e.key==='Enter')$('mpSend').click()});
            $('mpName').addEventListener('change',()=>{if(ws?.readyState===1)ws.send(JSON.stringify({type:'name',name:$('mpName').value.trim()||'Oyuncu'}))});
            setInterval(()=>{
              const g=window.__fpsGame,p=window.__fpsPlayer;
              if(!g||!p||ws?.readyState!==1)return;
              const t=performance.now();
              if(t-lastSend>60){lastSend=t;ws.send(JSON.stringify({type:'state',x:p.p.x,y:p.p.y,z:p.p.z,ry:p.ry,rx:p.rx,hp:p.hp,armor:p.armor,weapon:window.__fpsCurrentWeapon||'pistol'}))}
              for(const r of remotes.values()){r.position.lerp(r.userData.target,.28);r.rotation.y=r.userData.ry;const v=r.position.clone();v.y+=3.05;v.project(g.camera);r.userData.label.style.left=((v.x*.5+.5)*innerWidth)+'px';r.userData.label.style.top=((-v.y*.5+.5)*innerHeight)+'px';r.userData.label.style.display=v.z<1?'block':'none'}
            },60);
            window.mpSendShoot=(weapon,rx,ry)=>{if(ws?.readyState===1)ws.send(JSON.stringify({type:'shoot',weapon,rx,ry}))};
            connect();
          })();
          </script>'''

          # Expose the game objects to the multiplayer module.
          s = s.replace('const player={p:new THREE.Vector3(0,2,12),ry:0,rx:0,vy:0,jump:true,hp:100,armor:100,money:0,speed:8};window.__fpsPlayer=player;', 'const player={p:new THREE.Vector3(0,2,12),ry:0,rx:0,vy:0,jump:true,hp:100,armor:100,money:0,speed:8};window.__fpsPlayer=player;')
          s = s.replace('camera.add(gun);scene.add(camera);', 'camera.add(gun);scene.add(camera);window.__fpsGame={scene,camera,player};')
          s = s.replace("last=now;a.ammo--;camKick=", "last=now;a.ammo--;window.__fpsCurrentWeapon=current;if(window.mpSendShoot)window.mpSendShoot(current,player.rx,player.ry);camKick=")
          s = s.replace('</body></html>', mp + '</body></html>')
          p.write_text(s,encoding='utf-8')
          print('Multiplayer patch written')

      - name: Commit patched game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Enable online multiplayer client [skip ci]"
          git push
