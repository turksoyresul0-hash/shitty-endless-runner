name: Release QA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JSON
        run: node -e "JSON.parse(require('fs').readFileSync('game-meta.json','utf8')); console.log('game-meta.json OK')"
      - name: Syntax check server modules
        run: |
          node --check server.js
          node --check match-authority.js
          node --check movement-authority.js
          node --check team-authority.js
          node --check player-stats-authority.js
          node --check match-production-guard.js
      - name: Validate launch files
        run: |
          test -f privacy.html
          test -f terms.html
          test -f platform-sdk.js
          grep -q 'crazygames-sdk-v3.js' index.html
          grep -q 'platform-sdk.js' index.html
      - name: Validate authoritative combat guards
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('server.js','utf8');const m=fs.readFileSync('match-authority.js','utf8');for(const x of ['function matchLive','matchLive(p)','serverHitType','hitType','r.range','r.angle'])if(!s.includes(x))throw new Error('missing server guard: '+x);if(!m.includes(\"s.phase='live'\"))throw new Error('missing live phase guard');console.log('authoritative combat guards OK')"
      - name: Multiplayer lifecycle smoke test
        run: node qa-server-test.js
