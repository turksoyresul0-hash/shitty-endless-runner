name: Release QA
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Inject Multiplayer Animation"]
    types: [completed]
permissions:
  contents: read
jobs:
  qa:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate JSON
        run: node -e "JSON.parse(require('fs').readFileSync('game-meta.json','utf8')); console.log('game-meta.json OK')"
      - name: Syntax check server modules
        run: |
          node --check server.js
          node --check map-collision.js
          node --check match-authority.js
          node --check movement-authority.js
          node --check team-authority.js
          node --check player-stats-authority.js
          node --check match-production-guard.js
          node --check combat-authority.js
          node --check assist-authority.js
          node --check ranked-system.js
          node --check ranked-match-result.js
          node --check qa-server-test.js
          node --check network-fix.js
          node --check room-system.js
          node --check team-match.js
          node --check weapon-drop-visuals.js
      - name: Syntax-check browser game module
        run: |
          node -e 'const fs=require("fs");const h=fs.readFileSync("index.html","utf8");const m=h.match(/<script type="module">([\s\S]*?)<\/script>/);if(!m)throw new Error("main module not found");fs.writeFileSync("/tmp/fps-main.mjs",m[1]);'
          node --check /tmp/fps-main.mjs
      - name: Syntax-check all external JavaScript files
        run: |
          for f in *.js; do
            node --check "$f"
          done
      - name: Validate shared multiplayer connection
        run: |
          node -e 'const fs=require("fs");const h=fs.readFileSync("index.html","utf8");const n=(h.match(/<script type="module">/g)||[]).length;if(n!==1)throw new Error("expected exactly one inline game module, found "+n);for(const x of ["window.__fpsApplyServerHealth","window.__fpsApplyServerRespawn"])if(!h.includes(x))throw new Error("missing authoritative player lifecycle hook: "+x);'
          node -e 'for(const f of ["room-system.js","team-match.js"]){const s=require("fs").readFileSync(f,"utf8");if(s.includes("new WebSocket("))throw new Error(f+" must use the shared socket");if(!s.includes("fps:server-message"))throw new Error(f+" missing shared network events");}'
          grep -q 'window.__fpsNetConnect=connect' network-fix.js
          grep -q "fps:server-message" network-fix.js
          grep -q 'window.__fpsNetRaycastPlayers' network-fix.js
          grep -q 'window.mpSendPlayerHit' network-fix.js
          grep -q 'window.__fpsNetRaycastPlayers(ray' index.html
          grep -q 'window.mpSendPlayerHit(targetPlayer.id,current)' index.html
      - name: Validate weapon pickup wiring
        run: |
          grep -q 'window.__fpsServerWeapon=()=>current' index.html
          grep -q 'window.__fpsApplyPickedWeapon' index.html
          grep -q 'weapon-drop-visuals.js' index.html
          grep -q "roomBroadcast(dropRoom,{type:'weapon_drop'" server.js
          grep -q "fps:weapon-pickup" weapon-drop-visuals.js
      - name: Validate launch files
        run: |
          test -f privacy.html
          test -f terms.html
          test -f platform-sdk.js
          test -f combat-authority.js
          test -f map-collision.js
          grep -q 'crazygames-sdk-v3.js' index.html
          grep -q 'platform-sdk.js' index.html
          grep -q 'combat-authority' start.js
      - name: Validate authoritative combat guards
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('server.js','utf8');const m=fs.readFileSync('match-authority.js','utf8');for(const x of ['function matchLive','matchLive(p)','serverHitType','hitType','r.range','r.angle','blockedByWorld','MAP_BOXES','!matchLive(p)'])if(!s.includes(x))throw new Error('missing server guard: '+x);if(!m.includes(\"phase='live'\")&&!m.includes(\"phase==='live'\"))throw new Error('missing live phase guard');console.log('authoritative combat guards OK')"
      - name: Validate movement authority
        run: |
          grep -q 'MAX_JUMP_HEIGHT' movement-authority.js
          grep -q 'maxSpeed' movement-authority.js
      - name: Validate visible player aim geometry
        run: |
          grep -Fq 'headY=target.y+.34' server.js
          grep -Fq 'Math.atan2(-(b.x-a.x),-(b.z-a.z))' server.js
          grep -Fq 'x:-Math.sin(p.ry||0)*cp,y:sp,z:-Math.cos(p.ry||0)*cp' server.js
          grep -Fq 'bodyY=target.y-.5' server.js
          grep -Fq 'visible head aim was not classified as a headshot' qa-server-test.js
          grep -Fq 'rx:.05' qa-server-test.js
          grep -Fq 'window.mpSendPlayerHit(targetPlayer.id,current)' index.html
          grep -Fq 'money:storedCredits()' index.html
          grep -Fq 'function syncLocalCredits()' index.html
          grep -Fq "localStorage.setItem('fpsWallet',JSON.stringify(w))" lobby-progression.js
          grep -Fq "window.addEventListener('fps:money'" lobby-progression.js
          grep -Fq "const online=!!window.__fpsRoomCode;syncPlayMode(online)" index.html
          grep -Fq 'if(!online){enemyUpdate(dt);shotUpdate(dt);pickupUpdate(dt,t);barsUpdate()}' index.html
      - name: Multiplayer lifecycle smoke test
        run: node qa-server-test.js
