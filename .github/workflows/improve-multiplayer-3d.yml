name: Improve multiplayer 3D players

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upgrade remote player model
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker="const gun=new THREE.Group();gun.position.set(.55,1.38,-.55);"
          if marker not in s:
              raise SystemExit('remote player gun marker not found')
          if 'mp3dUpgrade' in s:
              print('3D upgrade already present')
              raise SystemExit(0)
          extra="""
              g.userData.mp3dUpgrade=true;
              const armorMat=new THREE.MeshStandardMaterial({color:0x3d4854,roughness:.65,metalness:.25});
              const darkMat=new THREE.MeshStandardMaterial({color:0x151b20,roughness:.8});
              const plate=new THREE.Mesh(new THREE.BoxGeometry(.62,.58,.16),armorMat);plate.position.set(0,1.58,-.30);plate.scale.set(1,.92,1);g.add(plate);
              const chest=new THREE.Mesh(new THREE.BoxGeometry(.48,.34,.12),new THREE.MeshStandardMaterial({color:0x222d37,roughness:.55,metalness:.2}));chest.position.set(0,1.68,-.40);g.add(chest);
              for(const side of [-1,1]){
                const shoulder=new THREE.Mesh(new THREE.SphereGeometry(.20,12,8),armorMat);shoulder.scale.set(1,.65,.9);shoulder.position.set(side*.53,1.78,-.02);g.add(shoulder);
                const pouch=new THREE.Mesh(new THREE.BoxGeometry(.16,.22,.13),darkMat);pouch.position.set(side*.28,1.35,-.37);g.add(pouch);
                const boot=new THREE.Mesh(new THREE.BoxGeometry(.24,.18,.38),darkMat);boot.position.set(side*.20,.20,-.07);g.add(boot);
              }
              const backpack=new THREE.Mesh(new THREE.BoxGeometry(.58,.72,.22),darkMat);backpack.position.set(0,1.42,.28);g.add(backpack);
              const helmetBand=new THREE.Mesh(new THREE.CylinderGeometry(.375,.375,.10,20),darkMat);helmetBand.position.set(0,2.55,0);g.add(helmetBand);
              const visor=new THREE.Mesh(new THREE.BoxGeometry(.38,.08,.08),new THREE.MeshStandardMaterial({color:0x101820,roughness:.2,metalness:.65}));visor.position.set(0,2.49,-.30);g.add(visor);
              const neck=new THREE.Mesh(new THREE.CylinderGeometry(.16,.18,.22,12),darkMat);neck.position.set(0,2.15,0);g.add(neck);
              const stock=new THREE.Mesh(new THREE.BoxGeometry(.16,.18,.38),darkMat);stock.position.set(.55,1.38,.18);gun.add(stock);
              const mag=new THREE.Mesh(new THREE.BoxGeometry(.14,.30,.18),darkMat);mag.position.set(.02,-.25,.08);gun.add(mag);
              const sight=new THREE.Mesh(new THREE.BoxGeometry(.10,.09,.24),new THREE.MeshStandardMaterial({color:0x0c1013,roughness:.15,metalness:.8}));sight.position.set(0,.14,-.12);gun.add(sight);
              const muzzleTip=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,.16,12),darkMat);muzzleTip.rotation.x=Math.PI/2;muzzleTip.position.set(0,0,-1.12);gun.add(muzzleTip);
          """
          s=s.replace(marker,marker+extra,1)
          p.write_text(s,encoding='utf-8')
          print('3D multiplayer player upgrade written')

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Upgrade multiplayer player 3D model [skip ci]"
          git push
