name: Load multiplayer damage feedback

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    if: "!contains(github.event.head_commit.message, '[auto]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject damage script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="damage-numbers.js"></script>'
          if tag not in s:
              if '</body></html>' in s:
                  s=s.replace('</body></html>',tag+'</body></html>')
              elif '</body>' in s:
                  s=s.replace('</body>',tag+'</body>')
              else:
                  raise SystemExit('No body tag found')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit injected script
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Inject multiplayer damage UI [auto]'
          git push
