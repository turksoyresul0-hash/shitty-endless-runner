name: Upgrade multiplayer two handed weapons

on:
  push:
    branches: [main]
    paths:
      - 'MP_TWOHAND_TRIGGER.md'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add two handed weapon rig
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='window.__mpCombatAnimationUpgrade=true;'
          if marker not in s:
              raise SystemExit('combat animation marker not found')
          if 'mpTwoHandRig' in s:
              print('two handed rig already present')
              raise SystemExit(0)
          extra=r'''
          function mpLimb(a,b,r,mat,parent){
            const va=new THREE.Vector3(...a),vb=new THREE.Vector3(...b),d=vb.clone().sub(va),len=d.length();
            const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r*1.08,len,10),mat);m.position.copy(va).add(vb).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());m.castShadow=true;parent.add(m);return m;
          }
          function mpSetupTwoHandRig(o){
            if(o.userData.mpTwoHandRig)return;
            const skin=new THREE.MeshStandardMaterial({color:0x7b563e,roughness:.9});
            const glove=new THREE.MeshStandardMaterial({color:0x171c20,roughness:.8});
            const rig=new THREE.Group();rig.name='mpTwoHandRig';o.add(rig);
            const rightArm=mpLimb([.40,1.76,-.02],[.57,1.48,-.52],.095,skin,rig);
            const leftArm=mpLimb([-.40,1.76,-.02],[.49,1.47,-.78],.095,skin,rig);
            mpLimb([.57,1.48,-.52],[.60,1.42,-.66],.075,glove,rig);
            mpLimb([.49,1.47,-.78],[.50,1.40,-.88],.075,glove,rig);
            const fore= new THREE.Mesh(new THREE.BoxGeometry(.10,.08,.10),glove);fore.position.set(.55,1.42,-.73);rig.add(fore);
            o.userData.mpTwoHandRig={rig,rightArm,leftArm};
          }
          const mpPrevCombatAnimate=window.__mpAnimate3D;
          window.__mpAnimate3D=()=>{
            if(mpPrevCombatAnimate)mpPrevCombatAnimate();
            const t=performance.now()*.006;
            scene.traverse(o=>{
              if(!(o.userData&&o.userData.mp3dAnimationUpgrade))return;
              mpSetupTwoHandRig(o);
              const rig=o.userData.mpTwoHandRig;
              if(!rig)return;
              const moving=!!(o.userData.mpMoving);
              const swing=moving?Math.sin(t*2.7+(o.userData.animPhase||0))*.035:Math.sin(t+(o.userData.animPhase||0))*.008;
              rig.rig.rotation.x=swing;
              rig.rig.rotation.z=moving?Math.sin(t*2.7+(o.userData.animPhase||0))*.018:0;
            });
          };
          '''
          s=s.replace(marker,marker+extra,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add two handed multiplayer weapon rig [skip ci]"
          git push
