name: Inject world network and match systems
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          for tag in ['<script src="world-upgrade.js"></script>','<script src="network-fix.js"></script>','<script src="match-system.js"></script>','<script src="match-server-sync.js"></script>']:
              if tag not in s:
                  s=s.replace('</body></html>',tag+'</body></html>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m '[auto-fix] inject authoritative match client'
          git push
