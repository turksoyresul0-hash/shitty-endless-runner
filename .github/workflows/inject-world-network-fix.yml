name: Inject world network and match systems
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          sdk='<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>'
          if sdk not in s:
              s=s.replace('</head>',sdk+'</head>')
          tags=[
            '<script src="world-upgrade.js"></script>',
            '<script src="network-fix.js"></script>',
            '<script src="match-system.js"></script>',
            '<script src="match-server-sync.js"></script>',
            '<script src="match-stats.js"></script>',
            '<script src="match-rewards.js"></script>',
            '<script src="ranked-system.js"></script>',
            '<script src="ranked-match-result.js"></script>',
            '<script src="match-result-ui.js"></script>',
            '<script src="scoreboard.js"></script>',
            '<script src="scoreboard-feed.js"></script>',
            '<script src="team-balance.js"></script>',
            '<script src="platform-sdk.js"></script>'
          ]
          for tag in tags:
              if tag not in s:
                  s=s.replace('</body></html>',tag+'</body></html>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m '[auto-fix] prepare monetized platform launch'
          git push
