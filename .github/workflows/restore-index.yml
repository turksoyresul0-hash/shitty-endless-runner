name: Restore working game index
on:
  push:
    paths:
      - '.github/workflows/restore-index.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore known working index
        run: |
          git checkout a2aa4472440ad2a5ab3c924ab343387b537aca82 -- index.html
          rm -f .github/workflows/restore-index.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/restore-index.yml
          git commit -m 'Restore working FPS game build'
          git push
